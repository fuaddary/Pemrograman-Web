<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minggu 3 — Layout Web Front-End dengan CSS</title>
  <meta name="description"
    content="Modul Kuliah Interaktif Minggu 3: Layout Web Front-End dengan CSS — Box Model, Positioning, Stacking Context, Flexbox, CSS Grid, Container Queries, Centering, dan Fluid Units.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0E2438;
      --panel: #123253;
      --panel-2: #1B3E60;
      --surface: #1B3E60;
      --line: #3C6E8F;
      --line-soft: rgba(74, 144, 184, 0.22);
      --text: #EAF2F6;
      --muted: #8FB2C8;
      --amber: #F2A93B;
      --coral: #E8654A;
      --mint: #5FC7A3;
      --on-text: #0E2438;
      --radius: 10px;
    }

    html.light-theme {
      --bg: #F6F8FA;
      --panel: #EAF0F5;
      --panel-2: #DCE6EE;
      --surface: #FFFFFF;
      --line: #B7C9D6;
      --line-soft: rgba(60, 110, 143, 0.18);
      --text: #132A3E;
      --muted: #5D7A91;
      --amber: #B8690A;
      --coral: #B23A26;
      --mint: #1F7A5C;
      --on-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      overflow: hidden;
      transition: background .2s ease, color .2s ease;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      opacity: .6;
      z-index: 0;
    }

    .deck {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 36px;
      border-bottom: 1px solid var(--line-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .topbar .crumb b {
      color: var(--text);
      font-weight: 500;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .15s ease;
    }

    .theme-toggle:hover {
      background: var(--panel-2);
    }

    .slides {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 40px 60px 30px;
      display: none;
      flex-direction: column;
      justify-content: safe center;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .slide.active {
      display: flex;
    }

    h1.headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.1;
      margin: 0 0 14px;
      max-width: 16ch;
      color: var(--text);
    }

    h2.sub {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(19px, 2.2vw, 26px);
      margin: 0 0 16px;
      color: var(--text);
    }

    p.lede {
      font-size: 16px;
      line-height: 1.65;
      color: var(--muted);
      max-width: 68ch;
      margin: 0 0 14px;
    }

    .tag {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      border-radius: 20px;
      padding: 4px 12px;
      margin-bottom: 16px;
      width: fit-content;
      background: color-mix(in srgb, var(--amber) 12%, transparent);
      color: var(--amber);
      border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    }

    .tag-mint {
      background: color-mix(in srgb, var(--mint) 12%, transparent);
      color: var(--mint);
      border-color: color-mix(in srgb, var(--mint) 40%, transparent);
    }

    .tag-coral {
      background: color-mix(in srgb, var(--coral) 10%, transparent);
      color: var(--coral);
      border-color: color-mix(in srgb, var(--coral) 35%, transparent);
    }

    .tag-muted {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 36px;
      border-top: 1px solid var(--line-soft);
      flex-shrink: 0;
    }

    .navbtn {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .navbtn:hover {
      background: var(--panel-2);
    }

    .navbtn:disabled {
      opacity: .35;
      cursor: default;
    }

    .navbtn.locked {
      opacity: .7;
    }

    .navbtn.shake {
      animation: shake .35s ease;
    }

    @keyframes shake {

      10%,
      90% {
        transform: translateX(-1px);
      }

      20%,
      80% {
        transform: translateX(2px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-4px);
      }

      40%,
      60% {
        transform: translateX(4px);
      }
    }

    .navbtn:focus-visible,
    button:focus-visible,
    .choice:focus-visible,
    .qc-option:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 44vw;
      justify-content: center;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--line);
      cursor: pointer;
      border: none;
      padding: 0;
      transition: all .2s ease;
    }

    .dot.on {
      background: var(--amber);
      width: 16px;
      border-radius: 4px;
    }

    .dot.passed-dot {
      background: var(--mint);
    }

    .mobile-nav-label {
      display: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .col {
      flex: 1;
      min-width: 260px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 20px;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    code,
    .mono-code,
    p code,
    li code,
    span.mono:not(.range-val) {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.88em;
      background: color-mix(in srgb, var(--amber) 15%, var(--panel));
      color: var(--amber);
      border: 1px solid color-mix(in srgb, var(--amber) 34%, transparent);
      padding: 1.5px 6.5px;
      border-radius: 5px;
      font-weight: 500;
      letter-spacing: -0.2px;
      display: inline-block;
      vertical-align: middle;
      line-height: 1.3;
      margin: 0 1.5px;
    }

    pre code,
    pre.snippet code {
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      font-size: inherit;
      font-weight: normal;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .two-col-gap {
      display: flex;
      gap: 44px;
      flex-wrap: wrap;
    }

    .cpmk {
      margin-top: 24px;
      display: flex;
      gap: 26px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .cpmk b {
      color: var(--mint);
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .credit-line {
      margin-top: 26px;
      font-size: 13px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .credit-line b {
      color: var(--text);
      font-weight: 500;
    }

    .agenda-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-width: 58ch;
    }

    .agenda-list li {
      display: flex;
      gap: 16px;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .agenda-list .num {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--amber);
      font-size: 14px;
      width: 22px;
    }

    .agenda-list .txt {
      font-size: 15px;
    }

    .agenda-list .txt small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .intro-layout {
      display: flex;
      gap: 40px;
      align-items: center;
      flex-wrap: wrap;
    }

    .intro-text {
      flex: 1.35;
      min-width: 300px;
    }

    .intro-visual {
      flex: 1;
      min-width: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-visual svg {
      width: 100%;
      max-width: 230px;
      height: auto;
    }

    .key-points {
      list-style: none;
      margin: 14px 0 0;
      padding: 0;
      max-width: 66ch;
    }

    .key-points li {
      position: relative;
      padding: 4px 0 4px 18px;
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .key-points li:before {
      content: "–";
      position: absolute;
      left: 0;
      color: var(--amber);
      font-weight: 600;
    }

    .ic-amber {
      stroke: var(--amber);
      fill: none;
    }

    .ic-coral {
      stroke: var(--coral);
      fill: none;
    }

    .ic-mint {
      stroke: var(--mint);
      fill: none;
    }

    .ic-line {
      stroke: var(--line);
      fill: none;
    }

    .ic-fill-amber {
      fill: var(--amber);
    }

    .ic-fill-coral {
      fill: var(--coral);
    }

    .ic-fill-mint {
      fill: var(--mint);
    }

    .ic-fill-soft {
      fill: var(--surface);
      stroke: var(--line);
    }

    .ic-text {
      fill: var(--text);
      stroke: var(--text);
    }

    .ic-muted {
      fill: var(--muted);
      stroke: none;
    }

    .ic-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-group label {
      display: block;
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .choice-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .choice {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'IBM Plex Mono';
    }

    .choice.on {
      background: var(--amber);
      color: var(--on-text);
      border-color: var(--amber);
      font-weight: 500;
    }

    input[type=range] {
      accent-color: var(--amber);
      width: 100%;
    }

    .range-val {
      font-size: 12px;
    }

    .example-layout {
      display: grid;
      grid-template-columns: 210px 1fr 1fr;
      gap: 22px;
      flex: 1;
      min-height: 0;
    }

    .example-col-label {
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .ex-controls {
      display: flex;
      flex-direction: column;
    }

    .code-panel {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 14px;
      font-family: 'IBM Plex Mono';
      font-size: 12.5px;
      line-height: 1.75;
      overflow: auto;
      height: calc(100% - 24px);
    }

    .cs-block {
      margin-bottom: 10px;
    }

    .cs-sel {
      color: #EAF2F6;
    }

    .cs-line {
      padding-left: 16px;
    }

    .cs-line.cs-hl {
      background: rgba(242, 169, 59, 0.18);
      border-radius: 4px;
      margin: 0 -6px;
      padding: 2px 6px 2px 22px;
    }

    .cs-prop {
      color: #7FD9BB;
    }

    .cs-val {
      color: #F2B25E;
    }

    .ex-result {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      height: calc(100% - 24px);
    }

    @media (max-width:900px) {
      .example-layout {
        grid-template-columns: 1fr;
        height: auto;
      }

      .code-panel,
      .ex-result {
        height: auto;
      }
    }

    .bm-stage {
      position: relative;
      width: 230px;
      height: 190px;
      background: color-mix(in srgb, var(--text) 4%, var(--bg));
      border: 1px dashed var(--line-soft);
    }

    .bm-margin {
      position: absolute;
      inset: 12px;
      border: 2px dashed transparent;
    }

    .bm-border {
      position: absolute;
      inset: 12px;
      border: 9px solid transparent;
    }

    .bm-padding {
      position: absolute;
      inset: 21px;
      border: 14px solid transparent;
    }

    .bm-content {
      position: absolute;
      inset: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      border-radius: 2px;
      color: var(--text);
    }

    .bm-margin.on {
      border-color: var(--amber);
    }

    .bm-border.on {
      border-color: var(--coral);
    }

    .bm-padding.on {
      border-color: var(--mint);
    }

    .bm-content.on {
      background: color-mix(in srgb, var(--text) 10%, transparent);
    }

    .pos-frame {
      position: relative;
      width: 100%;
      max-width: 280px;
      height: 190px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      transform: translateZ(0);
      background: var(--surface);
    }

    .pos-scroll-note {
      position: absolute;
      top: 6px;
      left: 8px;
      font-family: 'IBM Plex Mono';
      font-size: 10px;
      color: var(--muted);
      z-index: 5;
    }

    .pos-scroll {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding-top: 26px;
    }

    .pos-tall {
      height: 420px;
      padding: 10px;
    }

    .pos-box {
      width: 60px;
      height: 60px;
      background: var(--amber);
      color: var(--on-text);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      font-weight: 500;
    }

    .zstage {
      position: relative;
      width: 100%;
      height: 190px;
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      overflow: hidden;
    }

    .zbox {
      position: absolute;
      width: 96px;
      height: 66px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      color: var(--text);
      font-weight: 600;
      border: 1px solid;
    }

    .zbox.z-a {
      background: color-mix(in srgb, var(--amber) 28%, var(--surface));
      border-color: var(--amber);
    }

    .zbox.z-b {
      background: color-mix(in srgb, var(--coral) 28%, var(--surface));
      border-color: var(--coral);
    }

    .zbox.z-c {
      background: color-mix(in srgb, var(--mint) 28%, var(--surface));
      border-color: var(--mint);
    }

    .flex-stage {
      width: 100%;
      height: 100%;
      display: flex;
    }

    .flex-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      min-width: 44px;
      min-height: 44px;
      color: var(--text);
    }

    .mini-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-2);
      padding: 10px 14px;
      border-radius: 6px;
    }

    .mini-navbar .logo {
      font-weight: 600;
      font-size: 13px;
    }

    .mini-navbar .links {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: var(--muted);
    }

    .mini-cards {
      display: flex;
      gap: 10px;
    }

    .mini-cards .c {
      flex: 1;
      background: var(--panel-2);
      border-radius: 6px;
      padding: 14px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .pattern-card {
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      background: var(--panel);
    }

    .pattern-title {
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      color: var(--mint);
      margin-bottom: 10px;
    }

    .grid-stage {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 10px;
    }

    .grid-cell {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      color: var(--muted);
    }

    .autoFitWrap {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      transition: width .2s ease;
    }

    .areas-demo {
      display: grid;
      grid-template-columns: 90px 1fr;
      grid-template-rows: 42px 1fr 34px;
      grid-template-areas: "head head" "side main" "foot foot";
      gap: 8px;
      height: 190px;
      width: 100%;
      transition: all .2s ease;
    }

    .areas-demo.stacked {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto;
      grid-template-areas: "head" "side" "main" "foot";
      height: auto;
    }

    .a-head {
      grid-area: head;
    }

    .a-side {
      grid-area: side;
    }

    .a-main {
      grid-area: main;
    }

    .a-foot {
      grid-area: foot;
    }

    .areas-demo>div {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      color: var(--muted);
      min-height: 38px;
      padding: 6px 12px;
    }

    .resp-frame-outer {
      container-type: inline-size;
      background: transparent;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      transition: width .2s ease;
    }

    .resp-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    @container (min-width:320px) {
      .resp-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .resp-grid .r-cell {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    .center-demo {
      position: relative;
      width: 100%;
      height: 150px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .center-dot {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--amber);
    }

    .cd-flex {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cd-grid {
      display: grid;
      place-items: center;
    }

    .cd-abs .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .qc-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
    }

    .qc-option {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'IBM Plex Sans';
      font-size: 15px;

        {
          id: 'stacking', label: 'Materi 3', title: 'Stacking Context (z-index)',
          intro: '<p class="lede"><code class="mono">z-index</code> mengatur <b>stacking order</b> antar elemen yang saling menutupi di sumbu Z — tapi hanya berlaku pada elemen yang bukan <code class="mono">position: static</code>.</p><p class="lede">Konsep yang lebih dalam adalah <b>stacking context</b>: sebuah "ruang tumpuk" independen yang dibentuk oleh elemen tertentu (misalnya elemen dengan position + z-index, <code class="mono">opacity &lt; 1</code>, <code class="mono">transform</code>, atau <code class="mono">filter</code>). Di dalam satu stacking context, z-index anak-anaknya hanya dibandingkan satu sama lain — tidak bisa "menembus" ke luar stacking context induknya, meski nilainya sangat besar.</p><ul class="key-points"><li>z-index tanpa position bukan-static tidak berpengaruh sama sekali</li><li>Setiap stacking context baru "mengunci" jangkauan perbandingan z-index di dalamnya</li><li>Ini alasan klasik dropdown/modal tertutup elemen lain walau z-index-nya sudah sangat tinggi</li></ul>',

        {
          id: 'flexbasic', label: 'Materi 4', title: 'Flexbox: Basics',
          intro: '<p class="lede">Flexbox (<code class="mono">display: flex</code>) menata anak elemen sepanjang satu arah utama yang disebut <b>main axis</b>, dengan sumbu tegak lurusnya disebut <b>cross axis</b>.</p><ul class="key-points"><li><code class="mono">flex-direction</code> menentukan arah main axis: <code class="mono">row</code> (default) atau <code class="mono">column</code>, plus versi <code class="mono">-reverse</code></li><li><code class="mono">justify-content</code> mengatur distribusi ruang sepanjang main axis: <code class="mono">flex-start</code>, <code class="mono">center</code>, <code class="mono">space-between</code>, <code class="mono">space-around</code></li><li><code class="mono">align-items</code> mengatur posisi item sepanjang cross axis: <code class="mono">stretch</code> (default), <code class="mono">flex-start</code>, <code class="mono">center</code>, <code class="mono">flex-end</code></li></ul><p class="lede">Yang sering membingungkan pemula: karena main axis berubah mengikuti flex-direction, justify-content dan align-items ikut "bertukar peran" secara visual — saat <code class="mono">direction: column</code>, justify-content-lah yang mengatur arah vertikal.</p>',

        {

          intro: '<p class="lede">Setelah menguasai axis dasar, tiga properti ini membuat Flexbox terasa benar-benar powerful untuk layout nyata.</p><ul class="key-points"><li><code class="mono">flex-wrap: wrap</code> mengizinkan item pindah ke baris baru saat ruang tidak cukup, alih-alih dipaksa menyusut di satu baris (perilaku default <code class="mono">nowrap</code>)</li><li><code class="mono">flex-grow</code>, <code class="mono">flex-shrink</code>, dan <code class="mono">flex-basis</code> (sering disingkat <code class="mono">flex: grow shrink basis</code>) mengatur bagaimana item membesar/mengecil mengisi sisa ruang</li><li><code class="mono">order</code> mengubah urutan visual sebuah item tanpa mengubah urutan aslinya di HTML — berguna untuk reordering responsif, tapi perlu hati-hati karena bisa membingungkan urutan tab/keyboard navigation</li></ul>',

          previewHtml: '<div class="center-demo prev-target"><div class="center-dot"></div></div>',
          codeTemplate: function (s) {
            if (s.method === 'flex') return cssBlock('.container', [cssLine('display', 'flex', true), cssLine('align-items', 'center', true), cssLine('justify-content', 'center', true)]);
            if (s.method === 'grid') return cssBlock('.container', [cssLine('display', 'grid', true), cssLine('place-items', 'center', true)]);
            return cssBlock('.container', [cssLine('position', 'relative')]) + cssBlock('.dot', [cssLine('position', 'absolute', true), cssLine('top', '50%', true), cssLine('left', '50%', true), cssLine('transform', 'translate(-50%, -50%)', true)]);
          },
          applyPreview: function (s, root) {
            const el = root.querySelector('.prev-target');
            el.className = 'center-demo prev-target ' + (s.method === 'flex' ? 'cd-flex' : s.method === 'grid' ? 'cd-grid' : 'cd-abs');
          },
          quiz: {
            question: 'Teknik position: absolute + transform: translate(-50%, -50%) bekerja dengan cara…',
            explain: 'top/left 50% menempatkan sudut kiri-atas elemen tepat di tengah induk; translate(-50%,-50%) menggeser balik elemen sejauh setengah lebar/tingginya sendiri, sehingga benar-benar center.',
            options: [{ label: 'top/left 50% ke tengah induk, lalu translate mengoreksi sejauh setengah ukuran elemen itu sendiri', correct: true }, { label: 'transform hanya untuk animasi, tidak memengaruhi posisi', correct: false }, { label: '50% selalu mengacu ke ukuran viewport', correct: false }, { label: 'Teknik ini hanya berfungsi untuk teks', correct: false }]
          }
        },
        {
          id: 'fluid', label: 'Materi 12', title: 'Fluid Units: clamp() &amp; cqi',
          intro: '<p class="lede"><code class="mono">clamp(minimum, ideal, maksimum)</code> mengizinkan sebuah nilai (biasanya font-size atau spacing) menyusut dan membesar secara halus dalam batas aman, tanpa media query bertingkat.</p><p class="lede">Digabung dengan unit berbasis viewport (<code class="mono">vw</code>) atau container (<code class="mono">cqi</code>, <code class="mono">cqb</code> — container query units), nilai "ideal" bisa mengikuti lebar layar atau lebar induk secara proporsional. <code class="mono">cqi</code> = 1% dari inline-size (lebar) container terdekat yang mengaktifkan <code class="mono">container-type</code> — mirip vw, tapi relatif terhadap komponen, bukan seluruh layar.</p>',
          icon: icons.fluid,
          controls: [{ type: 'range', prop: 'width', label: 'lebar container', initial: 360, min: 200, max: 380, format: function (v) { return v + 'px'; } }],
          previewHtml: '<div class="resp-frame-outer prev-wrap" style="width:360px;"><div style="background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px; font-family:\'IBM Plex Mono\'; text-align:center; font-size:clamp(13px,5cqi,24px);">Aa — ikut menyusut/membesar</div></div>',
          codeTemplate: function (s) { return cssBlock('.judul', [cssLine('font-size', 'clamp(13px, 5cqi, 24px)', true)]); },
          applyPreview: function (s, root) { root.querySelector('.prev-wrap').style.width = s.width + 'px'; },
          quiz: {
            question: 'Apa itu unit cqi?',
            explain: 'cqi = 1% dari inline-size (lebar) container terdekat yang mengaktifkan container-type — mirip vw, tapi relatif ke container, bukan viewport.',
            options: [{ label: 'Persentase dari lebar container terdekat yang mengaktifkan container-type', correct: true }, { label: 'Sama seperti vw, selalu mengacu ke viewport', correct: false }, { label: 'Warna kustom di CSS', correct: false }, { label: 'Singkatan dari "click quantity indicator"', correct: false }]
          }
        }
      ];

      const deckPlan = [
        { kind: 'static', html: titleHTML },
        { kind: 'static', html: agendaHTML },
        { kind: 'topic', id: 'boxmodel' }, { kind: 'topic', id: 'positioning' }, { kind: 'topic', id: 'stacking' },
        { kind: 'topic', id: 'flexbasic' }, { kind: 'topic', id: 'flexadv' },
        { kind: 'static', html: flexPatternsHTML },
        { kind: 'topic', id: 'gridbasic' }, { kind: 'topic', id: 'gridadv' }, { kind: 'topic', id: 'gridspan' }, { kind: 'topic', id: 'gridareas' },
        { kind: 'topic', id: 'responsive' }, { kind: 'topic', id: 'centering' }, { kind: 'topic', id: 'fluid' },
        { kind: 'static', html: subgridHTML },
        { kind: 'static', html: challengeHTML },
        { kind: 'static', html: challengeGuideHTML },
        { kind: 'static', html: closingHTML }
      ];
      const topicById = {}; topics.forEach(function (t) { topicById[t.id] = t; });

      function renderControls(topic) {
        return topic.controls.map(function (ctrl) {
          if (ctrl.type === 'buttons') {
            const btns = ctrl.options.map(function (o) { return '<button class="choice' + (o.value === ctrl.initial ? ' on' : '') + '" data-value="' + o.value + '">' + o.label + '</button>'; }).join('');
            return '<div class="control-group"><label>' + ctrl.label + '</label><div class="choice-row" data-prop="' + ctrl.prop + '">' + btns + '</div></div>';
          }
          return '<div class="control-group"><label>' + ctrl.label + '</label><input type="range" min="' + ctrl.min + '" max="' + ctrl.max + '" value="' + ctrl.initial + '" data-prop="' + ctrl.prop + '" class="ex-range"><div class="mono range-val" style="color:var(--amber); margin-top:6px;" data-range-label>' + ctrl.format(ctrl.initial) + '</div></div>';
        }).join('');
      }

      function renderTopic(topic) {
        let html = '<section class="slide" id="intro-' + topic.id + '">';
        html += '<div class="tag">' + topic.label + '</div><h2 class="sub">' + topic.title + '</h2>';
        html += '<div class="intro-layout"><div class="intro-text">' + topic.intro + '</div><div class="intro-visual">' + topic.icon + '</div></div>';
        html += '</section>';

        html += '<section class="slide" data-example="' + topic.id + '">';
        html += '<div class="tag tag-muted">' + topic.title + ' — Contoh interaktif</div>';
        html += '<div class="example-layout">';
        html += '<div class="ex-controls">' + renderControls(topic) + '</div>';
        html += '<div><div class="example-col-label">Kode CSS (raw)</div><div class="code-panel" data-code></div></div>';
        html += '<div><div class="example-col-label">Hasil (live)</div><div class="ex-result" data-result>' + topic.previewHtml + '</div></div>';
        html += '</div></section>';

        topic.quiz.shuffled = shuffle(topic.quiz.options);
        html += '<section class="slide qc-slide" data-quiz="' + topic.id + '">';
        html += '<div class="tag tag-mint">Cek pemahaman · ' + topic.title + '</div>';
        html += '<h2 class="sub">' + topic.quiz.question + '</h2>';
        html += '<div class="qc-options">' + topic.quiz.shuffled.map(function (o, i) { return '<button class="qc-option" data-idx="' + i + '">' + o.label + '</button>'; }).join('') + '</div>';
        html += '<p class="qc-feedback"></p>';
        html += '</section>';
        return html;
      }

      let slidesHTML = '';
      deckPlan.forEach(function (entry) {
        slidesHTML += entry.kind === 'static' ? entry.html : renderTopic(topicById[entry.id]);
      });
      document.getElementById('slides').innerHTML = slidesHTML;

      // ---------- theme toggle ----------
      const themeToggle = document.getElementById('themeToggle');
      const sunIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><span>Light</span>';
      const moonIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span>Dark</span>';
      let isLight = false;
      themeToggle.addEventListener('click', function () {
        isLight = !isLight;
        document.documentElement.classList.toggle('light-theme', isLight);
        themeToggle.innerHTML = isLight ? moonIcon : sunIcon;
      });

      // ---------- wire up each topic's example + quiz ----------
      const COOLDOWN = 0; // seconds before a failed quiz can be retried
      topics.forEach(function (topic) {
        const exampleSection = document.querySelector('[data-example="' + topic.id + '"]');
        const codeEl = exampleSection.querySelector('[data-code]');
        const resultEl = exampleSection.querySelector('[data-result]');
        const state = {};
        topic.controls.forEach(function (c) { state[c.prop] = c.initial; });

        function update() {
          codeEl.innerHTML = topic.codeTemplate(state);
          topic.applyPreview(state, resultEl);
        }
        exampleSection.querySelectorAll('.choice-row').forEach(function (group) {
          const prop = group.dataset.prop;
          group.addEventListener('click', function (e) {
            const btn = e.target.closest('.choice'); if (!btn) return;
            group.querySelectorAll('.choice').forEach(function (b) { b.classList.remove('on'); });
            btn.classList.add('on');
            state[prop] = btn.dataset.value;
            update();
          });
        });
        exampleSection.querySelectorAll('.ex-range').forEach(function (input) {
          const prop = input.dataset.prop;
          const ctrl = topic.controls.find(function (c) { return c.prop === prop; });
          const label = input.parentElement.querySelector('[data-range-label]');
          input.addEventListener('input', function () {
            state[prop] = parseFloat(input.value);
            label.textContent = ctrl.format(state[prop]);
            update();
          });
        });
        update();

        // quiz wiring: wrong answer does NOT reveal the correct one; hard gate + cooldown
        const quizSection = document.querySelector('[data-quiz="' + topic.id + '"]');
        const feedback = quizSection.querySelector('.qc-feedback');
        let answered = false;
        let cooldownTimer = null;

        function clearTimer() {
          if (cooldownTimer) {
            clearInterval(cooldownTimer);
            cooldownTimer = null;
          }
        }

        function resetQuiz() {
          clearTimer();
          quizSection.querySelectorAll('.qc-option').forEach(function (b) { b.classList.remove('correct', 'wrong', 'locked'); });
          feedback.textContent = ''; feedback.className = 'qc-feedback';
          answered = false;
        }

        quizSection.querySelectorAll('.qc-option').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (answered) return;
            answered = true;
            clearTimer();
            quizSection.querySelectorAll('.qc-option').forEach(function (b) { b.classList.add('locked'); });
            const chosen = topic.quiz.shuffled[parseInt(btn.dataset.idx, 10)];
            if (chosen.correct) {
              btn.classList.add('correct');
              feedback.className = 'qc-feedback good';
              feedback.textContent = 'Betul — ' + topic.quiz.explain;
              quizSection.classList.add('passed');
              if (dots[slides.indexOf(quizSection)]) {
                dots[slides.indexOf(quizSection)].classList.add('passed-dot');
              }
              updateNextState();
            } else {
              btn.classList.add('wrong');
              let remaining = COOLDOWN;
              feedback.className = 'qc-feedback bad';
              feedback.textContent = 'Belum tepat. Pelajari lagi materinya — kembali otomatis dalam ' + remaining + 's…';
              cooldownTimer = setInterval(function () {
                remaining--;
                const stillHere = slides[idx] === quizSection;
                if (remaining > 0) {
                  if (stillHere) feedback.textContent = 'Belum tepat. Pelajari lagi materinya — kembali otomatis dalam ' + remaining + 's…';
                } else {
                  clearTimer();
                  resetQuiz();
                  if (stillHere) goToId('intro-' + topic.id);
                }
              }, 1000);
            }
          });
        });
      });

      // ---------- navigation with quiz gate ----------
      const slides = Array.from(document.querySelectorAll('.slide'));
      const dotsWrap = document.getElementById('dots');
      const curNum = document.getElementById('curNum');
      const totNum = document.getElementById('totNum');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const mobileProgress = document.getElementById('mobileProgress');
      let idx = 0;
      totNum.textContent = slides.length;
      slides[0].classList.add('active');

      function canAdvance() {
        const cur = slides[idx];
        if (cur.classList.contains('qc-slide') && !cur.classList.contains('passed')) return false;
        return true;
      }

      function canJumpTo(targetIdx) {
        if (targetIdx <= idx) return true;
        for (let j = 0; j < targetIdx; j++) {
          if (slides[j].classList.contains('qc-slide') && !slides[j].classList.contains('passed')) {
            return false;
          }
        }
        return true;
      }

      slides.forEach(function (_, i) {
        const d = document.createElement('button');
        d.className = 'dot' + (i === 0 ? ' on' : '');
        d.title = 'Slide ' + (i + 1);
        d.addEventListener('click', function () {
          if (!canJumpTo(i)) { shake(); return; }
          goTo(i);
        });
        dotsWrap.appendChild(d);
      });
      const dots = Array.from(dotsWrap.children);

      function updateNextState() {
        const cur = slides[idx];
        const blocked = cur.classList.contains('qc-slide') && !cur.classList.contains('passed');
        nextBtn.classList.toggle('locked', blocked);
        if (blocked) {
          nextBtn.textContent = 'Jawab dengan benar untuk lanjut';
        } else {
          nextBtn.innerHTML = 'Berikutnya<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left:6px; vertical-align:-1px;"><polyline points="9 18 15 12 9 6"/></svg>';
        }
      }
      function shake() {
        nextBtn.classList.add('shake');
        setTimeout(function () { nextBtn.classList.remove('shake'); }, 350);
      }
      function goTo(i) {
        if (i < 0 || i >= slides.length) return;
        slides[idx].classList.remove('active'); dots[idx].classList.remove('on');
        idx = i;
        slides[idx].classList.add('active'); dots[idx].classList.add('on');
        curNum.textContent = idx + 1;
        if (mobileProgress) mobileProgress.textContent = 'Slide ' + (idx + 1) + ' / ' + slides.length;
        prevBtn.disabled = idx === 0;
        updateNextState();
      }
      function goToId(id) {
        const target = document.getElementById(id);
        const i = slides.indexOf(target);
        if (i >= 0) goTo(i);
      }
      prevBtn.addEventListener('click', function () { goTo(idx - 1); });
      nextBtn.addEventListener('click', function () { if (canAdvance()) goTo(idx + 1); else shake(); });
      prevBtn.disabled = true;
      updateNextState();

      // Keyboard navigation (ignoring interactive input sliders)
      document.addEventListener('keydown', function (e) {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          if (e.key === ' ') e.preventDefault();
          if (canAdvance()) goTo(idx + 1); else shake();
        }
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          goTo(idx - 1);
        }
        if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen();
        }
      });

      // Touch Swipe for mobile & tablet
      let touchStartX = 0;
      let touchStartY = 0;
      document.addEventListener('touchstart', function (e) {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });
      document.addEventListener('touchend', function (e) {
        const diffX = e.changedTouches[0].screenX - touchStartX;
        const diffY = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX < 0) {
            if (canAdvance()) goTo(idx + 1); else shake();
          } else {
            goTo(idx - 1);
          }
        }
      }, { passive: true });

      // Fullscreen presentation mode
      const fsToggle = document.getElementById('fsToggle');
      const fsEnterIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg><span>Layar Penuh</span>';
      const fsExitIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg><span>Keluar Penuh</span>';
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function () { });
          if (fsToggle) fsToggle.innerHTML = fsExitIcon;
        } else {
          if (document.exitFullscreen) document.exitFullscreen().catch(function () { });
          if (fsToggle) fsToggle.innerHTML = fsEnterIcon;
        }
      }
      if (fsToggle) {
        fsToggle.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', function () {
          fsToggle.innerHTML = document.fullscreenElement ? fsExitIcon : fsEnterIcon;
        });
      }
    })();
  </script>
</body>

</html>
