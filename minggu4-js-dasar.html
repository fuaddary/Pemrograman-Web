<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Modul Kuliah Interaktif Minggu 4: Dasar-Dasar JavaScript — Variables, Data Types, Truthy/Falsy, Coercion, Template Literals, Operators, Scope, Conditionals, Loops, Functions, Arrays, Objects, dan Script Placement.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0E2438;
      --panel: #123253;
      --panel-2: #1B3E60;
      --surface: #1B3E60;
      --line: #3C6E8F;
      --line-soft: rgba(74, 144, 184, 0.22);
      --text: #EAF2F6;
      --muted: #8FB2C8;
      --amber: #F2A93B;
      --coral: #E8654A;
      --mint: #5FC7A3;
      --on-text: #0E2438;
      --radius: 10px;
    }

    html.light-theme {
      --bg: #F6F8FA;
      --panel: #EAF0F5;
      --panel-2: #DCE6EE;
      --surface: #FFFFFF;
      --line: #B7C9D6;
      --line-soft: rgba(60, 110, 143, 0.18);
      --text: #132A3E;
      --muted: #5D7A91;
      --amber: #B8690A;
      --coral: #B23A26;
      --mint: #1F7A5C;
      --on-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      overflow: hidden;
      transition: background .2s ease, color .2s ease;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      opacity: .6;
      z-index: 0;
    }

    .deck {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 36px;
      border-bottom: 1px solid var(--line-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .topbar .crumb b {
      color: var(--text);
      font-weight: 500;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .15s ease;
    }

    .theme-toggle:hover {
      background: var(--panel-2);
    }

    .slides {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 40px 60px 30px;
      display: none;
      flex-direction: column;
      justify-content: safe center;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .slide.active {
      display: flex;
    }

    h1.headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.1;
      margin: 0 0 14px;
      max-width: 16ch;
      color: var(--text);
    }

    h2.sub {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(19px, 2.2vw, 26px);
      margin: 0 0 16px;
      color: var(--text);
    }

    p.lede {
      font-size: 16px;
      line-height: 1.65;
      color: var(--muted);
      max-width: 68ch;
      margin: 0 0 14px;
    }

    .tag {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      border-radius: 20px;
      padding: 4px 12px;
      margin-bottom: 16px;
      width: fit-content;
      background: color-mix(in srgb, var(--amber) 12%, transparent);
      color: var(--amber);
      border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    }

    .tag-mint {
      background: color-mix(in srgb, var(--mint) 12%, transparent);
      color: var(--mint);
      border-color: color-mix(in srgb, var(--mint) 40%, transparent);
    }

    .tag-coral {
      background: color-mix(in srgb, var(--coral) 10%, transparent);
      color: var(--coral);
      border-color: color-mix(in srgb, var(--coral) 35%, transparent);
    }

    .tag-muted {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 36px;
      border-top: 1px solid var(--line-soft);
      flex-shrink: 0;
    }

    .navbtn {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .navbtn:hover {
      background: var(--panel-2);
    }

    .navbtn:disabled {
      opacity: .35;
      cursor: default;
    }

    .navbtn.locked {
      opacity: .7;
    }

    .navbtn.shake {
      animation: shake .35s ease;
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    .navbtn:focus-visible,
    button:focus-visible,
    .choice:focus-visible,
    .qc-option:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 44vw;
      justify-content: center;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--line);
      cursor: pointer;
      border: none;
      padding: 0;
      transition: all .2s ease;
    }

    .dot.on {
      background: var(--amber);
      width: 16px;
      border-radius: 4px;
    }

    .dot.passed-dot {
      background: var(--mint);
    }

    .mobile-nav-label {
      display: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .col {
      flex: 1;
      min-width: 260px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 20px;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    code,
    .mono-code,
    p code,
    li code,
    span.mono:not(.range-val) {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.88em;
      background: color-mix(in srgb, var(--amber) 15%, var(--panel));
      color: var(--amber);
      border: 1px solid color-mix(in srgb, var(--amber) 34%, transparent);
      padding: 1.5px 6.5px;
      border-radius: 5px;
      font-weight: 500;
      letter-spacing: -0.2px;
      display: inline-block;
      vertical-align: middle;
      line-height: 1.3;
      margin: 0 1.5px;
    }

    pre code,
    pre.snippet code {
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      font-size: inherit;
      font-weight: normal;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .two-col-gap {
      display: flex;
      gap: 44px;
      flex-wrap: wrap;
    }

    .cpmk {
      margin-top: 24px;
      display: flex;
      gap: 26px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .cpmk b {
      color: var(--mint);
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .credit-line {
      margin-top: 26px;
      font-size: 13px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .credit-line b {
      color: var(--text);
      font-weight: 500;
    }

    .agenda-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 0 36px;
    }

    .agenda-list li {
      display: flex;
      gap: 16px;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .agenda-list .num {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--amber);
      font-size: 13px;
      width: 22px;
    }

    .agenda-list .txt {
      font-size: 14px;
    }

    .agenda-list .txt small {
      display: block;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 1px;
    }

    .intro-layout {
      display: flex;
      gap: 40px;
      align-items: center;
      flex-wrap: wrap;
    }

    .intro-text {
      flex: 1.35;
      min-width: 300px;
    }

    .intro-visual {
      flex: 1;
      min-width: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-visual svg {
      width: 100%;
      max-width: 230px;
      height: auto;
    }

    .key-points {
      list-style: none;
      margin: 14px 0 0;
      padding: 0;
      max-width: 66ch;
    }

    .key-points li {
      position: relative;
      padding: 4px 0 4px 18px;
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .key-points li:before {
      content: "–";
      position: absolute;
      left: 0;
      color: var(--amber);
      font-weight: 600;
    }

    .ic-amber {
      stroke: var(--amber);
      fill: none;
    }

    .ic-coral {
      stroke: var(--coral);
      fill: none;
    }

    .ic-mint {
      stroke: var(--mint);
      fill: none;
    }

    .ic-line {
      stroke: var(--line);
      fill: none;
    }

    .ic-fill-amber {
      fill: var(--amber);
    }

    .ic-fill-coral {
      fill: var(--coral);
    }

    .ic-fill-mint {
      fill: var(--mint);
    }

    .ic-fill-soft {
      fill: var(--surface);
      stroke: var(--line);
    }

    .ic-text {
      fill: var(--text);
      stroke: var(--text);
    }

    .ic-muted {
      fill: var(--muted);
      stroke: none;
    }

    .ic-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-group label {
      display: block;
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .choice-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .choice {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'IBM Plex Mono';
      transition: all .15s ease;
    }

    .choice.on {
      background: var(--amber);
      color: var(--on-text);
      border-color: var(--amber);
      font-weight: 500;
    }

    .example-layout {
      display: grid;
      grid-template-columns: 210px 1fr 1fr;
      gap: 22px;
      flex: 1;
      min-height: 0;
    }

    .example-col-label {
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .ex-controls {
      display: flex;
      flex-direction: column;
    }

    .code-panel {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 14px;
      font-family: 'IBM Plex Mono';
      font-size: 12.5px;
      line-height: 1.8;
      overflow: auto;
      height: calc(100% - 24px);
    }

    .cs-block {
      margin-bottom: 10px;
    }

    .cs-sel {
      color: #EAF2F6;
    }

    .cs-line {
      padding-left: 0;
    }

    .cs-line.cs-hl {
      background: rgba(242, 169, 59, 0.18);
      border-radius: 4px;
      margin: 0 -6px;
      padding: 2px 6px;
    }

    .cs-kw {
      color: #7FD9BB;
    }

    .cs-val {
      color: #F2B25E;
    }

    .cs-com {
      color: #6C8AA1;
      font-style: italic;
    }

    .cs-fn {
      color: #8FC7FF;
    }

    .console-line {
      padding: 2px 0;
      white-space: pre-wrap;
    }

    .console-line:before {
      content: "› ";
      color: #4F7089;
    }

    .console-out {
      color: #EAF2F6;
    }

    .console-error {
      color: #FF8A75;
    }

    .console-error:before {
      content: "✕ ";
      color: #FF8A75;
    }

    .console-value {
      color: #F2B25E;
    }

    .console-good {
      color: #7FD9BB;
    }

    .ex-result {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      height: calc(100% - 24px);
    }

    @media (max-width:900px) {
      .example-layout {
        grid-template-columns: 1fr;
        height: auto;
      }

      .code-panel {
        height: auto;
      }
    }

    .pattern-card {
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      background: var(--panel);
    }

    .pattern-title {
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      color: var(--mint);
      margin-bottom: 10px;
    }

    pre.snippet {
      margin: 10px 0 0;
      white-space: pre-wrap;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      color: var(--muted);
      background: var(--panel-2);
      padding: 10px 12px;
      border-radius: 6px;
    }

    .challenge-mock {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      font-family: 'IBM Plex Mono';
      font-size: 12.5px;
      color: #EAF2F6;
      line-height: 1.7;
    }

    /* Step by Step Guide Card for Challenge */
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .step-card {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .step-num {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--amber);
      background: color-mix(in srgb, var(--amber) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
      padding: 1.5px 7px;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .step-card h3 {
      margin: 0 0 4px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
    }

    .step-card p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .checklist {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .checklist li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 6px 0;
      font-size: 14px;
    }

    .checklist li:before {
      content: "-";
      color: var(--amber);
      font-family: 'IBM Plex Mono';
      font-weight: 600;
    }

    /* Live Calculator Demo Box */
    .calc-tester {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .calc-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .calc-input {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono';
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
      width: 80px;
    }

    .calc-select {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--amber);
      font-family: 'IBM Plex Mono';
      font-size: 14px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .calc-btn {
      background: var(--amber);
      color: var(--on-text);
      border: none;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity .15s ease;
    }

    .calc-btn:hover {
      opacity: .9;
    }

    .calc-out-box {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      min-height: 38px;
      display: flex;
      align-items: center;
    }

    .qc-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
    }

    .qc-option {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'IBM Plex Sans';
      font-size: 15px;
      transition: background .15s ease, border-color .15s ease;
    }

    .qc-option:hover {
      background: var(--panel-2);
    }

    .qc-option.correct {
      background: color-mix(in srgb, var(--mint) 15%, transparent);
      border-color: var(--mint);
    }

    .qc-option.wrong {
      background: color-mix(in srgb, var(--coral) 15%, transparent);
      border-color: var(--coral);
    }

    .qc-option.locked {
      cursor: default;
      pointer-events: none;
    }

    .qc-feedback {
      margin-top: 16px;
      font-size: 14px;
      min-height: 20px;
      max-width: 600px;
      line-height: 1.5;
    }

    .qc-feedback.good {
      color: var(--mint);
    }

    .qc-feedback.bad {
      color: var(--coral);
    }

    @media (max-width:760px) {
      .slide {
        padding: 24px 18px 18px;
        justify-content: flex-start;
      }

      .topbar,
      .navbar {
        padding: 12px 16px;
      }

      .topbar .crumb {
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 48vw;
      }

      .row,
      .two-col-gap {
        gap: 16px;
      }

      .dots {
        display: none;
      }

      .mobile-nav-label {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="ic-text" />
      </marker>
      <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-opacity="0.18" />
      </filter>
    </defs>
  </svg>
  <div class="grid-bg"></div>
  <div class="deck">
    <div class="topbar">
      <div class="crumb">Pemrograman Web · ET234305 — <b>Minggu 4: Dasar-Dasar JavaScript</b></div>
      <div class="topbar-right">
        <button class="theme-toggle" id="fsToggle" title="Mode Layar Penuh (F)"><svg width="13" height="13"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
          </svg><span>Layar Penuh</span></button>

  const topics = [
    {
      id:'variables', label:'Materi 1', title:'Variables: let, const, var',
      intro:'<p class="lede">Variabel adalah "wadah bernama" untuk menyimpan nilai. JavaScript modern menyediakan tiga cara mendeklarasikannya, dan pilihannya bukan sekadar gaya penulisan — masing-masing punya aturan main berbeda.</p><ul class="key-points"><li><code class="mono">let</code>: bisa diisi ulang (reassign), scope-nya block (terikat pada <code class="mono">{ }</code> tempat ia dideklarasikan)</li><li><code class="mono">const</code>: <b>tidak bisa</b> di-reassign setelah didefinisikan, scope block sama seperti let — pilihan default yang disarankan kecuali memang perlu berubah</li><li><code class="mono">var</code>: peninggalan JavaScript lama, scope-nya function (bukan block) dan bisa di-<i>hoist</i> — sumber bug klasik, sebaiknya dihindari di kode baru</li></ul><p class="lede">Catatan penting: <code class="mono">const</code> mencegah <em>reassignment</em>, bukan mencegah perubahan isi objek/array di dalamnya — <code class="mono">const arr = []; arr.push(1);</code> tetap valid.</p>',

    {
      id:'datatypes', label:'Materi 2', title:'Data Types & typeof',
      intro:'<p class="lede">JavaScript punya beberapa tipe data primitif dasar: <code class="mono">number</code>, <code class="mono">string</code>, <code class="mono">boolean</code>, <code class="mono">undefined</code>, dan <code class="mono">null</code> — plus tipe majemuk seperti <code class="mono">object</code> (termasuk array dan function).</p><p class="lede">Operator <code class="mono">typeof</code> memberi tahu tipe sebuah nilai saat runtime. Berguna untuk validasi input atau debugging, tapi punya beberapa "quirks" historis yang penting diketahui.</p><ul class="key-points"><li><code class="mono">typeof null</code> menghasilkan <code class="mono">"object"</code> — bug historis dari versi JavaScript pertama, dibiarkan demi kompatibilitas mundur</li><li><code class="mono">typeof</code> array juga <code class="mono">"object"</code> — gunakan <code class="mono">Array.isArray()</code> untuk mengecek array secara spesifik</li><li><code class="mono">undefined</code> berarti "belum diberi nilai", <code class="mono">null</code> berarti "sengaja dikosongkan"</li></ul>',

    {
      id:'truthyfalsy', label:'Materi 3', title:'Truthy & Falsy Values',
      intro:'<p class="lede">Setiap nilai di JavaScript, apapun tipenya, punya "identitas boolean" tersembunyi saat dipakai dalam konteks kondisi (<code class="mono">if</code>, <code class="mono">&&</code>, <code class="mono">||</code>, <code class="mono">!!</code>). Nilai yang dianggap setara <code class="mono">false</code> disebut <b>Falsy</b>, sisanya <b>Truthy</b>.</p><ul class="key-points"><li>Hanya ada segelintir nilai Falsy: <code class="mono">false</code>, <code class="mono">0</code>, <code class="mono">""</code> (string kosong), <code class="mono">null</code>, <code class="mono">undefined</code>, <code class="mono">NaN</code></li><li><b>Semua</b> yang lain Truthy — termasuk yang sering disangka falsy: string <code class="mono">"0"</code>, array kosong <code class="mono">[]</code>, dan object kosong <code class="mono">{}</code> semuanya Truthy!</li><li>Ini alasan <code class="mono">if (array.length)</code> lebih aman dipakai daripada <code class="mono">if (array)</code> untuk mengecek array kosong</li></ul>',

      quiz:{question:'Array kosong [] dianggap Truthy atau Falsy?', explain:'Truthy — ini kesalahpahaman umum. Hanya 0, "", null, undefined, NaN, dan false yang Falsy; array kosong (dan object kosong {}) tetap Truthy karena tetap merupakan sebuah object.',

    {
      id:'coercion', label:'Materi 4', title:'Type Coercion & Conversion',
      intro:'<p class="lede">JavaScript sering mengonversi tipe data secara otomatis (<b>implicit coercion</b>) saat operand berbeda tipe dipakai bersama sebuah operator — dan ini salah satu sumber bug paling membingungkan bagi pemula.</p><ul class="key-points"><li>Operator <code class="mono">+</code> dengan salah satu operand string akan melakukan <b>penggabungan teks</b>: <code class="mono">"5" + 3</code> → <code class="mono">"53"</code></li><li>Operator <code class="mono">-</code>, <code class="mono">*</code>, <code class="mono">/</code> tidak punya makna untuk string, jadi JavaScript mengonversi ke angka dulu: <code class="mono">"5" - 3</code> → <code class="mono">2</code></li><li>Konversi eksplisit lebih aman: <code class="mono">Number("5")</code>, <code class="mono">String(5)</code>, <code class="mono">Boolean(0)</code> — kalian yang mengontrol, bukan JavaScript yang menebak</li></ul>',

      quiz:{question:'Kenapa "5" + 3 menghasilkan "53", tapi "5" - 3 menghasilkan 2?', explain:'Operator + punya makna ganda: penjumlahan angka ATAU penggabungan teks — dengan operand string, JS memilih penggabungan teks. Operator -, *, / tidak punya makna untuk string sama sekali, jadi JS terpaksa mengonversi string ke angka lebih dulu.',

      icon:icons.templateliterals,

    {
      id:'operators', label:'Materi 6', title:'Operators & Comparison',
      intro:'<p class="lede">JavaScript punya dua operator kesetaraan: <code class="mono">==</code> (loose equality) dan <code class="mono">===</code> (strict equality). Perbedaannya, digabung dengan konsep type coercion yang baru dibahas, adalah sumber bug paling umum bagi pemula.</p><ul class="key-points"><li><code class="mono">==</code> melakukan <b>type coercion</b> — mengubah tipe salah satu operand agar bisa dibandingkan, sehingga <code class="mono">5 == "5"</code> bernilai <code class="mono">true</code></li><li><code class="mono">===</code> membandingkan nilai <em>dan</em> tipe sekaligus, tanpa konversi apa pun — <code class="mono">5 === "5"</code> bernilai <code class="mono">false</code></li><li>Rekomendasi umum: selalu gunakan <code class="mono">===</code> kecuali kalian benar-benar paham dan sengaja memanfaatkan coercion-nya</li></ul>',

    {
      id:'scope', label:'Materi 7', title:'Scope: Global, Function, Block',
      intro:'<p class="lede">Scope menentukan <b>di mana sebuah variabel "terlihat" dan bisa diakses</b>. JavaScript punya tiga tingkat scope yang saling bersarang seperti boneka Matryoshka.</p><ul class="key-points"><li><b>Global scope</b>: variabel yang dideklarasikan di luar fungsi/blok mana pun, bisa diakses dari seluruh file</li><li><b>Function scope</b>: variabel yang dideklarasikan di dalam sebuah fungsi hanya bisa diakses di dalam fungsi itu</li><li><b>Block scope</b>: variabel <code class="mono">let</code>/<code class="mono">const</code> di dalam <code class="mono">{ }</code> (termasuk if, for, while) hanya hidup di dalam blok itu — ini yang tidak berlaku untuk <code class="mono">var</code></li></ul><p class="lede">Aturan praktis: kode di dalam bisa "melihat" ke luar (mengakses variabel global dari dalam fungsi), tapi kode di luar <b>tidak bisa</b> melihat ke dalam.</p>',

  function renderTopic(topic){
    let html = '<section class="slide" id="intro-'+topic.id+'">';
    html += '<div class="tag">'+topic.label+'</div><h2 class="sub">'+topic.title+'</h2>';
    html += '<div class="intro-layout"><div class="intro-text">'+topic.intro+'</div><div class="intro-visual">'+topic.icon+'</div></div>';
    html += '</section>';

    html += '<section class="slide" data-example="'+topic.id+'">';
    html += '<div class="tag tag-muted">'+topic.title+' — Contoh interaktif</div>';
    html += '<div class="example-layout">';
    html += '<div class="ex-controls">'+renderControls(topic)+'</div>';
    html += '<div><div class="example-col-label">Kode JavaScript</div><div class="code-panel" data-code></div></div>';
    html += '<div><div class="example-col-label">Console Output</div><div class="code-panel" data-result></div></div>';
    html += '</div></section>';

    topic.quiz.shuffled = shuffle(topic.quiz.options);
    html += '<section class="slide qc-slide" data-quiz="'+topic.id+'">';
    html += '<div class="tag tag-mint">Cek pemahaman · '+topic.title+'</div>';
    html += '<h2 class="sub">'+topic.quiz.question+'</h2>';
    html += '<div class="qc-options">'+topic.quiz.shuffled.map(function(o,i){ return '<button class="qc-option" data-idx="'+i+'">'+o.label+'</button>'; }).join('')+'</div>';
    html += '<p class="qc-feedback"></p>';
    html += '</section>';
    return html;
  }

  let slidesHTML = '';
  deckPlan.forEach(function(entry){
    slidesHTML += entry.kind==='static' ? entry.html : renderTopic(topicById[entry.id]);
  });
  document.getElementById('slides').innerHTML = slidesHTML;

  // ---------- theme toggle ----------
  const themeToggle = document.getElementById('themeToggle');
  const sunIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><span>Light</span>';
  const moonIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span>Dark</span>';
  let isLight = false;
  themeToggle.addEventListener('click', function(){
    isLight = !isLight;
    document.documentElement.classList.toggle('light-theme', isLight);
    themeToggle.innerHTML = isLight ? moonIcon : sunIcon;
  });

  // ---------- fullscreen presentation mode ----------
  const fsToggle = document.getElementById('fsToggle');
  const fsEnterIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg><span>Layar Penuh</span>';
  const fsExitIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg><span>Keluar Penuh</span>';
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(function(){});
      if(fsToggle) fsToggle.innerHTML = fsExitIcon;
    } else {
      if(document.exitFullscreen) document.exitFullscreen().catch(function(){});
      if(fsToggle) fsToggle.innerHTML = fsEnterIcon;
    }
  }
  if(fsToggle){
    fsToggle.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', function(){
      fsToggle.innerHTML = document.fullscreenElement ? fsExitIcon : fsEnterIcon;
    });
  }

  // ---------- live calculator simulator on challenge slide ----------
  const calcA = document.getElementById('calcA');
  const calcB = document.getElementById('calcB');
  const calcOp = document.getElementById('calcOp');
  const calcRunBtn = document.getElementById('calcRunBtn');
  const calcOut = document.getElementById('calcOut');

  function runCalculatorSim(){
    if(!calcA || !calcB || !calcOp || !calcOut) return;
    const a = parseFloat(calcA.value);
    const b = parseFloat(calcB.value);
    const op = calcOp.value;

    if(isNaN(a) || isNaN(b)){
      calcOut.innerHTML = '<span class="console-error">✕ Error: Input a dan b harus berupa angka valid!</span>';
      return;
    }

    if(op === '/' && b === 0){
      calcOut.innerHTML = '<span class="console-error">✕ Error: Pembagian dengan 0 tidak diperbolehkan!</span>';
      return;
    }

    let res;
    if(op === '+') res = a + b;
    else if(op === '-') res = a - b;
    else if(op === '*') res = a * b;
    else if(op === '/') res = a / b;

    calcOut.innerHTML = '<span class="console-good">› kalkulator(' + a + ', ' + b + ', "' + op + '") → <b class="console-value">' + res + '</b> ✓</span>';
  }

  if(calcRunBtn){
    calcRunBtn.addEventListener('click', runCalculatorSim);
    [calcA, calcB, calcOp].forEach(function(el){
      if(el) el.addEventListener('input', runCalculatorSim);
    });
  }

  // ---------- wire up each topic's example + quiz ----------
  const COOLDOWN = 7;
  topics.forEach(function(topic){
    const exampleSection = document.querySelector('[data-example="'+topic.id+'"]');
    const codeEl = exampleSection.querySelector('[data-code]');
    const resultEl = exampleSection.querySelector('[data-result]');
    const state = {};
    topic.controls.forEach(function(c){ state[c.prop] = c.initial; });

    function update(){
      codeEl.innerHTML = topic.codeTemplate(state);
      resultEl.innerHTML = topic.outputTemplate(state);
    }
    exampleSection.querySelectorAll('.choice-row').forEach(function(group){
      const prop = group.dataset.prop;
      group.addEventListener('click', function(e){
        const btn = e.target.closest('.choice'); if(!btn) return;
        group.querySelectorAll('.choice').forEach(function(b){ b.classList.remove('on'); });
        btn.classList.add('on');
        state[prop] = btn.dataset.value;
        update();
      });
    });
    update();

    const quizSection = document.querySelector('[data-quiz="'+topic.id+'"]');
    const feedback = quizSection.querySelector('.qc-feedback');
    let answered = false;
    let cooldownTimer = null;

    function clearTimer(){
      if(cooldownTimer){
        clearInterval(cooldownTimer);
        cooldownTimer = null;
      }
    }

    function resetQuiz(){
      clearTimer();
      quizSection.querySelectorAll('.qc-option').forEach(function(b){ b.classList.remove('correct','wrong','locked'); });
      feedback.textContent = ''; feedback.className = 'qc-feedback';
      answered = false;
    }

    quizSection.querySelectorAll('.qc-option').forEach(function(btn){
      btn.addEventListener('click', function(){
        if(answered) return;
        answered = true;
        clearTimer();
        quizSection.querySelectorAll('.qc-option').forEach(function(b){ b.classList.add('locked'); });
        const chosen = topic.quiz.shuffled[parseInt(btn.dataset.idx, 10)];
        if(chosen.correct){
          btn.classList.add('correct');
          feedback.className = 'qc-feedback good';
          feedback.textContent = 'Betul — ' + topic.quiz.explain;
          quizSection.classList.add('passed');
          if(dots[slides.indexOf(quizSection)]){
            dots[slides.indexOf(quizSection)].classList.add('passed-dot');
          }
          updateNextState();
        } else {
          btn.classList.add('wrong');
          let remaining = COOLDOWN;
          feedback.className = 'qc-feedback bad';
          feedback.textContent = 'Belum tepat. Pelajari lagi materinya — kembali otomatis dalam ' + remaining + 's…';
          cooldownTimer = setInterval(function(){
            remaining--;
            const stillHere = slides[idx] === quizSection;
            if(remaining > 0){
              if(stillHere) feedback.textContent = 'Belum tepat. Pelajari lagi materinya — kembali otomatis dalam ' + remaining + 's…';
            } else {
              clearTimer();
              resetQuiz();
              if(stillHere) goToId('intro-'+topic.id);
            }
          }, 1000);
        }
      });
    });
  });

  // ---------- navigation with quiz gate ----------
  const slides = Array.from(document.querySelectorAll('.slide'));
  const dotsWrap = document.getElementById('dots');
  const curNum = document.getElementById('curNum');
  const totNum = document.getElementById('totNum');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const mobileProgress = document.getElementById('mobileProgress');
  let idx = 0;
  totNum.textContent = slides.length;
  slides[0].classList.add('active');

  function canAdvance(){
    const cur = slides[idx];
    if(cur.classList.contains('qc-slide') && !cur.classList.contains('passed')) return false;
    return true;
  }

  function canJumpTo(targetIdx){
    if(targetIdx <= idx) return true;
    for(let j = 0; j < targetIdx; j++){
      if(slides[j].classList.contains('qc-slide') && !slides[j].classList.contains('passed')){
        return false;
      }
    }
    return true;
  }

  slides.forEach(function(_, i){
    const d = document.createElement('button');
    d.className = 'dot' + (i===0 ? ' on' : '');
    d.title = 'Slide ' + (i+1);
    d.addEventListener('click', function(){
      if(!canJumpTo(i)){ shake(); return; }
      goTo(i);
    });
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(dotsWrap.children);

  function updateNextState(){
    const cur = slides[idx];
    const blocked = cur.classList.contains('qc-slide') && !cur.classList.contains('passed');
    nextBtn.classList.toggle('locked', blocked);
    if(blocked){
      nextBtn.textContent = 'Jawab dengan benar untuk lanjut';
    } else {
      nextBtn.innerHTML = 'Berikutnya<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left:6px; vertical-align:-1px;"><polyline points="9 18 15 12 9 6"/></svg>';
    }
  }
  function shake(){
    nextBtn.classList.add('shake');
    setTimeout(function(){ nextBtn.classList.remove('shake'); }, 350);
  }
  function goTo(i){
    if(i < 0 || i >= slides.length) return;
    slides[idx].classList.remove('active'); dots[idx].classList.remove('on');
    idx = i;
    slides[idx].classList.add('active'); dots[idx].classList.add('on');
    curNum.textContent = idx+1;
    if(mobileProgress) mobileProgress.textContent = 'Slide ' + (idx+1) + ' / ' + slides.length;
    prevBtn.disabled = idx===0;
    updateNextState();
  }
  function goToId(id){
    const target = document.getElementById(id);
    const i = slides.indexOf(target);
    if(i>=0) goTo(i);
  }
  prevBtn.addEventListener('click', function(){ goTo(idx-1); });
  nextBtn.addEventListener('click', function(){ if(canAdvance()) goTo(idx+1); else shake(); });
  prevBtn.disabled = true;
  updateNextState();

  // Keyboard navigation
  document.addEventListener('keydown', function(e){
    if(['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){
      if(e.key === ' ') e.preventDefault();
      if(canAdvance()) goTo(idx+1); else shake();
    }
    if(e.key === 'ArrowLeft' || e.key === 'PageUp'){
      goTo(idx-1);
    }
    if(e.key === 'f' || e.key === 'F'){
      toggleFullscreen();
    }
  });

  // Touch Swipe for mobile & tablet
  let touchStartX = 0;
  let touchStartY = 0;
  document.addEventListener('touchstart', function(e){
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });
  document.addEventListener('touchend', function(e){
    const diffX = e.changedTouches[0].screenX - touchStartX;
    const diffY = e.changedTouches[0].screenY - touchStartY;
    if(Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)){
      if(diffX < 0){
        if(canAdvance()) goTo(idx+1); else shake();
      } else {
        goTo(idx-1);
      }
    }
  }, { passive: true });
})();
</script>
</body>
</html>
