<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Modul Kuliah Interaktif Minggu 5: DOM Manipulation & Event Handling — DOM tree, querySelector, textContent vs innerHTML, classList & atribut, createElement, addEventListener, objek event, validasi form, bubbling, event delegation, dan pola state → render. Dilengkapi Live Coding Lab dengan auto-check.">
  <title>Minggu 5 · DOM Manipulation &amp; Event Handling — Pemrograman Web ET234305</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0E2438;
      --panel: #123253;
      --panel-2: #1B3E60;
      --surface: #1B3E60;
      --line: #3C6E8F;
      --line-soft: rgba(74, 144, 184, 0.22);
      --text: #EAF2F6;
      --muted: #8FB2C8;
      --amber: #F2A93B;
      --coral: #E8654A;
      --mint: #5FC7A3;
      --on-text: #0E2438;
      --radius: 10px;
    }

    html.light-theme {
      --bg: #F6F8FA;
      --panel: #EAF0F5;
      --panel-2: #DCE6EE;
      --surface: #FFFFFF;
      --line: #B7C9D6;
      --line-soft: rgba(60, 110, 143, 0.18);
      --text: #132A3E;
      --muted: #5D7A91;
      --amber: #B8690A;
      --coral: #B23A26;
      --mint: #1F7A5C;
      --on-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      overflow: hidden;
      transition: background .2s ease, color .2s ease;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      opacity: .6;
      z-index: 0;
    }

    .deck {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 36px;
      border-bottom: 1px solid var(--line-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .topbar .crumb b {
      color: var(--text);
      font-weight: 500;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .15s ease;
    }

    .theme-toggle:hover {
      background: var(--panel-2);
    }

    .slides {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 40px 60px 30px;
      display: none;
      flex-direction: column;
      justify-content: safe center;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .slide.active {
      display: flex;
    }

    h1.headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.1;
      margin: 0 0 14px;
      max-width: 16ch;
      color: var(--text);
    }

    h2.sub {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(19px, 2.2vw, 26px);
      margin: 0 0 16px;
      color: var(--text);
    }

    p.lede {
      font-size: 16px;
      line-height: 1.65;
      color: var(--muted);
      max-width: 68ch;
      margin: 0 0 14px;
    }

    .tag {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      border-radius: 20px;
      padding: 4px 12px;
      margin-bottom: 16px;
      width: fit-content;
      background: color-mix(in srgb, var(--amber) 12%, transparent);
      color: var(--amber);
      border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    }

    .tag-mint {
      background: color-mix(in srgb, var(--mint) 12%, transparent);
      color: var(--mint);
      border-color: color-mix(in srgb, var(--mint) 40%, transparent);
    }

    .tag-coral {
      background: color-mix(in srgb, var(--coral) 10%, transparent);
      color: var(--coral);
      border-color: color-mix(in srgb, var(--coral) 35%, transparent);
    }

    .tag-muted {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 36px;
      border-top: 1px solid var(--line-soft);
      flex-shrink: 0;
    }

    .navbtn {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .navbtn:hover {
      background: var(--panel-2);
    }

    .navbtn:disabled {
      opacity: .35;
      cursor: default;
    }

    .navbtn.locked {
      opacity: .7;
    }

    .navbtn.shake {
      animation: shake .35s ease;
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    .navbtn:focus-visible,
    button:focus-visible,
    .choice:focus-visible,
    .qc-option:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 44vw;
      justify-content: center;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--line);
      cursor: pointer;
      border: none;
      padding: 0;
      transition: all .2s ease;
    }

    .dot.on {
      background: var(--amber);
      width: 16px;
      border-radius: 4px;
    }

    .dot.passed-dot {
      background: var(--mint);
    }

    .mobile-nav-label {
      display: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .col {
      flex: 1;
      min-width: 260px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 20px;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    code,
    .mono-code,
    p code,
    li code,
    span.mono:not(.range-val) {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.88em;
      background: color-mix(in srgb, var(--amber) 15%, var(--panel));
      color: var(--amber);
      border: 1px solid color-mix(in srgb, var(--amber) 34%, transparent);
      padding: 1.5px 6.5px;
      border-radius: 5px;
      font-weight: 500;
      letter-spacing: -0.2px;
      display: inline-block;
      vertical-align: middle;
      line-height: 1.3;
      margin: 0 1.5px;
    }

    pre code,
    pre.snippet code {
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      font-size: inherit;
      font-weight: normal;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .two-col-gap {
      display: flex;
      gap: 44px;
      flex-wrap: wrap;
    }

    .cpmk {
      margin-top: 24px;
      display: flex;
      gap: 26px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .cpmk b {
      color: var(--mint);
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .credit-line {
      margin-top: 26px;
      font-size: 13px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .credit-line b {
      color: var(--text);
      font-weight: 500;
    }

    .agenda-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 0 36px;
    }

    .agenda-list li {
      display: flex;
      gap: 16px;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .agenda-list .num {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--amber);
      font-size: 13px;
      width: 22px;
    }

    .agenda-list .txt {
      font-size: 14px;
    }

    .agenda-list .txt small {
      display: block;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 1px;
    }

    .intro-layout {
      display: flex;
      gap: 40px;
      align-items: center;
      flex-wrap: wrap;
    }

    .intro-text {
      flex: 1.35;
      min-width: 300px;
    }

    .intro-visual {
      flex: 1;
      min-width: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-visual svg {
      width: 100%;
      max-width: 230px;
      height: auto;
    }

    .key-points {
      list-style: none;
      margin: 14px 0 0;
      padding: 0;
      max-width: 66ch;
    }

    .key-points li {
      position: relative;
      padding: 4px 0 4px 18px;
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .key-points li:before {
      content: "–";
      position: absolute;
      left: 0;
      color: var(--amber);
      font-weight: 600;
    }

    .ic-amber {
      stroke: var(--amber);
      fill: none;
    }

    .ic-coral {
      stroke: var(--coral);
      fill: none;
    }

    .ic-mint {
      stroke: var(--mint);
      fill: none;
    }

    .ic-line {
      stroke: var(--line);
      fill: none;
    }

    .ic-fill-amber {
      fill: var(--amber);
    }

    .ic-fill-coral {
      fill: var(--coral);
    }

    .ic-fill-mint {
      fill: var(--mint);
    }

    .ic-fill-soft {
      fill: var(--surface);
      stroke: var(--line);
    }

    .ic-text {
      fill: var(--text);
      stroke: var(--text);
    }

    .ic-muted {
      fill: var(--muted);
      stroke: none;
    }

    .ic-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-group label {
      display: block;
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .choice-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .choice {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'IBM Plex Mono';
      transition: all .15s ease;
    }

    .choice.on {
      background: var(--amber);
      color: var(--on-text);
      border-color: var(--amber);
      font-weight: 500;
    }

    .example-layout {
      display: grid;
      grid-template-columns: 210px 1fr 1fr;
      gap: 22px;
      flex: 1;
      min-height: 0;
    }

    .example-col-label {
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .ex-controls {
      display: flex;
      flex-direction: column;
    }

    .code-panel {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 14px;
      font-family: 'IBM Plex Mono';
      font-size: 12.5px;
      line-height: 1.8;
      overflow: auto;
      height: calc(100% - 24px);
    }

    .cs-block {
      margin-bottom: 10px;
    }

    .cs-sel {
      color: #EAF2F6;
    }

    .cs-line {
      padding-left: 0;
    }

    .cs-line.cs-hl {
      background: rgba(242, 169, 59, 0.18);
      border-radius: 4px;
      margin: 0 -6px;
      padding: 2px 6px;
    }

    .cs-kw {
      color: #7FD9BB;
    }

    .cs-val {
      color: #F2B25E;
    }

    .cs-com {
      color: #6C8AA1;
      font-style: italic;
    }

    .cs-fn {
      color: #8FC7FF;
    }

    .console-line {
      padding: 2px 0;
      white-space: pre-wrap;
    }

    .console-line:before {
      content: "› ";
      color: #4F7089;
    }

    .console-out {
      color: #EAF2F6;
    }

    .console-error {
      color: #FF8A75;
    }

    .console-error:before {
      content: "✕ ";
      color: #FF8A75;
    }

    .console-value {
      color: #F2B25E;
    }

    .console-good {
      color: #7FD9BB;
    }

    .ex-result {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      height: calc(100% - 24px);
    }

    @media (max-width:900px) {
      .example-layout {
        grid-template-columns: 1fr;
        height: auto;
      }

      .code-panel {
        height: auto;
      }
    }

    .pattern-card {
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      background: var(--panel);
    }

    .pattern-title {
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      color: var(--mint);
      margin-bottom: 10px;
    }

    pre.snippet {
      margin: 10px 0 0;
      white-space: pre-wrap;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      color: var(--muted);
      background: var(--panel-2);
      padding: 10px 12px;
      border-radius: 6px;
    }

    .challenge-mock {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      font-family: 'IBM Plex Mono';
      font-size: 12.5px;
      color: #EAF2F6;
      line-height: 1.7;
    }

    /* Step by Step Guide Card for Challenge */
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .step-card {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .step-num {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--amber);
      background: color-mix(in srgb, var(--amber) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
      padding: 1.5px 7px;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .step-card h3 {
      margin: 0 0 4px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
    }

    .step-card p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .checklist {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .checklist li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 6px 0;
      font-size: 14px;
    }

    .checklist li:before {
      content: "-";
      color: var(--amber);
      font-family: 'IBM Plex Mono';
      font-weight: 600;
    }

    /* Live Calculator Demo Box */
    .calc-tester {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .calc-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .calc-input {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono';
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
      width: 80px;
    }

    .calc-select {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--amber);
      font-family: 'IBM Plex Mono';
      font-size: 14px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .calc-btn {
      background: var(--amber);
      color: var(--on-text);
      border: none;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity .15s ease;
    }

    .calc-btn:hover {
      opacity: .9;
    }

    .calc-out-box {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      min-height: 38px;
      display: flex;
      align-items: center;
    }

    .qc-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
    }

    .qc-option {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'IBM Plex Sans';
      font-size: 15px;
      transition: background .15s ease, border-color .15s ease;
    }

    .qc-option:hover {
      background: var(--panel-2);
    }

    .qc-option.correct {
      background: color-mix(in srgb, var(--mint) 15%, transparent);
      border-color: var(--mint);
    }

    .qc-option.wrong {
      background: color-mix(in srgb, var(--coral) 15%, transparent);
      border-color: var(--coral);
    }

    .qc-option.locked {
      cursor: default;
      pointer-events: none;
    }

    .qc-feedback {
      margin-top: 16px;
      font-size: 14px;
      min-height: 20px;
      max-width: 600px;
      line-height: 1.5;
    }

    .qc-feedback.good {
      color: var(--mint);
    }

    .qc-feedback.bad {
      color: var(--coral);
    }

    @media (max-width:760px) {
      .slide {
        padding: 24px 18px 18px;
        justify-content: flex-start;
      }

      .topbar,
      .navbar {
        padding: 12px 16px;
      }

      .topbar .crumb {
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 48vw;
      }

      .row,
      .two-col-gap {
        gap: 16px;
      }

      .dots {
        display: none;
      }

      .mobile-nav-label {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }

    /* ================= Minggu 5 additions: live preview, console, live coding lab ================= */
    .counter { font-family: 'IBM Plex Mono', monospace; }

    .lab-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 5px 11px;
      border-radius: 20px;
      border: 1px solid color-mix(in srgb, var(--mint) 45%, transparent);
      color: var(--mint);
      background: color-mix(in srgb, var(--mint) 10%, transparent);
      white-space: nowrap;
    }

    /* highlight tokens (shared by code panels and editor) */
    .tk-kw { color: #7FD9BB; }
    .tk-str { color: #F2B25E; }
    .tk-num { color: #F2B25E; }
    .tk-com { color: #6C8AA1; font-style: italic; }
    .tk-fn { color: #8FC7FF; }
    .tk-tag { color: #FF9E80; }
    .tk-attr { color: #8FC7FF; }
    .tk-punc { color: #8FB2C8; }

    .code-panel pre.hl-code {
      margin: 0;
      font: inherit;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
      color: #EAF2F6;
    }
    .code-panel .ln { display: block; padding: 0 6px; margin: 0 -6px; border-radius: 4px; min-height: 1.8em; }
    .code-panel .ln.cs-hl { background: rgba(242, 169, 59, 0.18); }

  <script type="text/plain" data-k="challenge-js">
(function () {
  let tugas = [
    { id: 1, judul: "Lab 10 event delegation", matkul: "Pemrograman Web", deadline: "2026-10-08", selesai: false },
    { id: 2, judul: "ERD sistem perpustakaan", matkul: "Basis Data", deadline: "2026-10-12", selesai: true }
  ];
  let filter = "semua", nextId = 3;
  const form = document.querySelector("#form"), list = document.querySelector("#list");
  function render() {
    const data = tugas.filter(t => filter === "semua" || (filter === "aktif" ? !t.selesai : t.selesai));
    list.innerHTML = "";
    if (!data.length) { list.innerHTML = '<li class="kosong">Tidak ada tugas di sini 🎉</li>'; }
    data.forEach(t => {
      const li = document.createElement("li");
      li.dataset.id = t.id;
      li.className = t.selesai ? "done" : "";
      li.innerHTML = '<input type="checkbox" class="cek"><div class="isi"><div class="judul"></div><div class="meta"></div></div><button class="hapus">✕</button>';
      li.querySelector(".cek").checked = t.selesai;
      li.querySelector(".judul").textContent = t.judul;
      li.querySelector(".meta").textContent = t.matkul + " · deadline " + t.deadline;
      list.append(li);
    });
    document.querySelector("#counter").textContent = tugas.filter(t => !t.selesai).length + " tugas aktif";
  }
  form.addEventListener("submit", e => {
    e.preventDefault();
    const judul = form.elements.judul.value.trim(), deadline = form.elements.deadline.value;
    const err = document.querySelector("#err");
    if (judul.length < 3) { err.textContent = "Judul minimal 3 karakter."; return; }
    if (!deadline) { err.textContent = "Deadline wajib diisi."; return; }
    err.textContent = "";
    tugas.push({ id: nextId++, judul, matkul: form.elements.matkul.value, deadline, selesai: false });
    form.reset();
    render();
  });
  list.addEventListener("click", e => {
    const li = e.target.closest("li[data-id]"); if (!li) return;
    const id = Number(li.dataset.id);
    if (e.target.closest(".hapus")) tugas = tugas.filter(t => t.id !== id);
    else if (e.target.closest(".cek")) tugas = tugas.map(t => t.id === id ? { ...t, selesai: !t.selesai } : t);
    else return;
    render();
  });
  document.querySelector("#filter").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll("#filter button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });
  render();
})();

<script>
(function(){

  /* =====================================================================
     Utilitas
     ===================================================================== */
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  // Ambil blok teks mentah (script type=text/plain, atribut data-k), buang indentasi umum
  function block(k){
    const el = document.querySelector('script[data-k="'+k+'"]');
    if(!el) return '';
    const lines = el.textContent.replace(/^\n+/, '').replace(/\s+$/, '').split('\n');
    let min = Infinity;
    lines.forEach(function(l){ if(l.trim()){ const m = l.match(/^ */)[0].length; if(m<min) min=m; } });
    if(!isFinite(min)) min = 0;
    return lines.map(function(l){ return l.slice(min); }).join('\n');
  }

  /* =====================================================================
     Syntax highlighter mini (JS & HTML) — dipakai panel kode & editor
     ===================================================================== */
  const JS_RE = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\[\s\S]|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|of|in|while|do|new|true|false|null|undefined|this|typeof|instanceof|switch|case|break|continue|default|class|try|catch|finally|throw|async|await)\b|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)(?=\s*\()/g;
  function hlJS(src){
    let out = '', last = 0, m;
    JS_RE.lastIndex = 0;
    while((m = JS_RE.exec(src))){
      out += esc(src.slice(last, m.index));
      const cls = m[1] ? 'tk-com' : m[2] ? 'tk-str' : m[3] ? 'tk-kw' : m[4] ? 'tk-num' : 'tk-fn';
      out += '<span class="'+cls+'">'+esc(m[0])+'</span>';
      last = JS_RE.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function hlHTML(src){
    let out = '', last = 0, m;
    const RE = /<\!--[\s\S]*?-->|<\/?[a-zA-Z][^>]*>/g;   // "<\!" agar parser HTML tidak masuk mode komentar
    while((m = RE.exec(src))){
      out += esc(src.slice(last, m.index));
      if(m[0].startsWith('<' + '!--')) out += '<span class="tk-com">'+esc(m[0])+'</span>';
      else out += hlTagSafe(m[0]);
      last = RE.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  // versi aman: tokenisasi manual isi tag supaya teks di luar token tetap di-escape
  function hlTagSafe(tag){
    let out = '', i = 0, m;
    const RE = /^(<\/?)([\w-]+)/;
    m = tag.match(RE);
    if(m){ out += '<span class="tk-punc">'+esc(m[1])+'</span><span class="tk-tag">'+esc(m[2])+'</span>'; i = m[0].length; }
    const rest = tag.slice(i);
    const TK = /("[^"]*"|'[^']*')|([\w\-:@]+)(?==)|(\/?>$)/g;
    let last = 0;
    while((m = TK.exec(rest))){
      out += esc(rest.slice(last, m.index));
      if(m[1]) out += '<span class="tk-str">'+esc(m[1])+'</span>';
      else if(m[2]) out += '<span class="tk-attr">'+esc(m[2])+'</span>';
      else out += '<span class="tk-punc">'+esc(m[3])+'</span>';
      last = TK.lastIndex;
    }
    return out + esc(rest.slice(last));
  }

  /* =====================================================================
     Sandbox runner: halaman mini di <iframe srcdoc> + console yang ditangkap
     ===================================================================== */
  const BASE_CSS = '*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:14px;color:#1d2b36;font-size:14px;line-height:1.45;background:#fff}h1{font-size:20px;margin:0 0 6px}h3{font-size:16px}button{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid #132A3E;background:#132A3E;color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #b7c9d6;border-radius:6px;background:#fff;color:#1d2b36}.kartu{border:1px solid #d7e1e8;border-radius:10px;padding:12px 14px;background:#fff}code{font-family:"IBM Plex Mono",ui-monospace,monospace;background:#eef3f7;padding:0 4px;border-radius:3px}kbd{border:1px solid #b7c9d6;border-radius:3px;padding:0 4px;font-size:11px}';

  // Fungsi ini TIDAK dijalankan di halaman slide — kodenya disisipkan ke dalam iframe.
  function PRELUDE(RID, START, NLINES){
    var P = window.parent;
    window.__LOGS = [];
    window.__CHECKING = false;
    function tag(el){
      var s = el.tagName.toLowerCase();
      if(el.id) s += '#' + el.id;
      if(el.classList && el.classList.length) s += '.' + Array.prototype.join.call(el.classList, '.');
      return s;
    }
    function fmt(v, d){
      var t = typeof v;
      if(v === null) return {s:'null', k:'val'};
      if(t === 'undefined') return {s:'undefined', k:'muted'};
      if(t === 'string') return d ? {s:JSON.stringify(v), k:'val'} : {s:v, k:'str'};
      if(t === 'number' || t === 'boolean' || t === 'bigint') return {s:String(v), k:'val'};
      if(t === 'function') return {s:'ƒ ' + (v.name || 'anonymous') + '()', k:'muted'};
      if(v instanceof Element){
        if(d) return {s:tag(v), k:'el'};
        var h = v.outerHTML.replace(/\s+/g, ' ');
        if(h.length > 150) h = h.slice(0, 150) + '…';
        return {s:h, k:'el'};
      }
      if(v instanceof Text) return {s:'#text "' + v.textContent.trim().slice(0, 40) + '"', k:'el'};
      if(v instanceof NodeList || v instanceof HTMLCollection){
        var arr = Array.prototype.slice.call(v);
        var nm = (v instanceof NodeList) ? 'NodeList' : 'HTMLCollection';
        return {s: nm + '(' + arr.length + ') [' + arr.slice(0, 8).map(function(x){ return x.nodeType === 1 ? tag(x) : '#text'; }).join(', ') + (arr.length > 8 ? ', …' : '') + ']', k:'el'};
      }
      if(typeof DOMTokenList !== 'undefined' && v instanceof DOMTokenList) return {s:'DOMTokenList [' + Array.prototype.map.call(v, function(c){ return JSON.stringify(c); }).join(', ') + ']', k:'val'};
      if(v instanceof Event){
        return {s: v.constructor.name + ' {type: "' + v.type + '", target: ' + (v.target && v.target.tagName ? tag(v.target) : String(v.target)) + '}', k:'muted'};
      }
      if(v instanceof Error) return {s: v.name + ': ' + v.message, k:'val'};
      if(Array.isArray(v)){
        if(d > 1) return {s:'Array(' + v.length + ')', k:'muted'};
        return {s:'[' + v.slice(0, 20).map(function(x){ return fmt(x, d + 1).s; }).join(', ') + (v.length > 20 ? ', …' : '') + ']', k:'val'};
      }
      if(t === 'object'){
        if(d > 1) return {s:'{…}', k:'muted'};
        var keys = Object.keys(v);
        var name = (v.constructor && v.constructor.name && v.constructor.name !== 'Object') ? v.constructor.name + ' ' : '';
        return {s: name + '{' + keys.slice(0, 12).map(function(k){ return k + ': ' + fmt(v[k], d + 1).s; }).join(', ') + (keys.length > 12 ? ', …' : '') + '}', k:'val'};
      }
      return {s:String(v), k:'val'};
    }
    function post(msg){ msg.__dom5 = RID; try { P.postMessage(msg, '*'); } catch(e){} }
    function send(type, args){
      var parts = Array.prototype.map.call(args, function(a){ try { return fmt(a, 0); } catch(e){ return {s:String(a), k:'val'}; } });
      window.__LOGS.push(parts.map(function(p){ return p.s; }).join(' '));
      post({type:type, parts:parts});
    }
    window.__send = send;
    ['log', 'info', 'warn', 'error', 'table', 'dir', 'debug'].forEach(function(k){
      var orig = console[k];
      var type = (k === 'warn' || k === 'error') ? k : 'log';
      console[k] = function(){ send(type, arguments); try { orig && orig.apply(console, arguments); } catch(e){} };
    });
    window.addEventListener('error', function(e){
      var msg = e.message || 'Error';
      if(msg.indexOf('Uncaught') !== 0) msg = 'Uncaught ' + msg;
      var ln = e.lineno ? (e.lineno - START + 1) : 0;
      if(ln >= 1 && ln <= NLINES) msg += '   ← baris ' + ln;
      window.__LOGS.push(msg);
      post({type:'error', parts:[{s:msg, k:'str'}]});
    });
    window.addEventListener('unhandledrejection', function(e){
      post({type:'error', parts:[{s:'Uncaught (in promise) ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)), k:'str'}]});
    });
    // Simulasi perilaku default browser yang "meninggalkan halaman"
    window.addEventListener('click', function(e){
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if(!a) return;
      var href = a.getAttribute('href');
      if(!href || href.charAt(0) === '#' || href.indexOf('javascript:') === 0) return;
      if(e.defaultPrevented) return;
      e.preventDefault(); e.__simNav = true;
      if(window.__CHECKING) return;
      send('warn', ['Perilaku default <a>: browser pindah ke "' + href + '". Halaman lama (dan state-nya) ditinggalkan.']);
      document.body.innerHTML = '';
      var box = document.createElement('div');
      box.style.cssText = 'font-family:system-ui;padding:22px;color:#5d7a91';
      box.innerHTML = '<div style="font-size:28px">📄</div><h3 style="margin:6px 0;color:#132a3e"></h3><p style="margin:0 0 8px">Browser berpindah ke halaman lain — halaman sebelumnya beserta script &amp; state-nya hilang.</p><p style="font-size:12px;margin:0">Klik ↻ di bilah alamat untuk memuat ulang contoh.</p>';
      box.querySelector('h3').textContent = href;
      document.body.appendChild(box);
      post({type:'nav', href:href});
    });
    window.addEventListener('submit', function(e){
      if(e.defaultPrevented) return;
      e.preventDefault(); e.__simNav = true;
      if(window.__CHECKING) return;
      send('warn', ['Form ter-submit TANPA e.preventDefault() → browser memuat ulang halaman. Isian form & state JavaScript hilang!']);
      setTimeout(function(){ post({type:'reload'}); }, 700);
    });
    window.__report = function(res){ post({type:'check', res:res}); };
  }

  function buildDoc(o, rid){
    const js = (o.js || '').replace(/<\/script/gi, '<\\/script');
    const nlines = (o.js || '').split('\n').length;
    let head = '<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + BASE_CSS + '</style>'
      + '<script>(' + PRELUDE.toString() + ')(' + JSON.stringify(rid) + ',@@START@@,' + nlines + ');<\/script></head><body>\n'
      + (o.html || '') + '\n'
      + (o.helper ? '<script>\n' + o.helper.replace(/<\/script/gi, '<\\/script') + '\n<\/script>\n' : '')
      + '<script>\n';
    const start = head.split('\n').length;
    head = head.replace('@@START@@', String(start));
    let doc = head + js + '\n<\/script>\n';
    if(o.check){
      doc += '<script>window.__SRC=' + JSON.stringify(o.js || '').replace(/</g, '\\u003c') + ';'
        + 'window.addEventListener("load",function(){setTimeout(function(){window.__CHECKING=true;var __res=[];'
        + 'function t(c,m){__res.push([!!c,m]);}function $(s){return document.querySelector(s);}function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s));}'
        + 'try{\n' + o.check.replace(/<\/script/gi, '<\\/script') + '\n}catch(err){__res.push([false,"Error saat pengecekan: "+err.message]);}'
        + 'window.__CHECKING=false;window.__report(__res);},80);});<\/script>\n';
    }
    return doc + '</body></html>';
  }

  const runs = {};
  let runSeq = 0;
  const MAX_LINES = 250;

  function makeRunner(root, url){
    const frame = root.querySelector('.browser-frame');
    const cons = root.querySelector('.console-body');
    const burl = root.querySelector('.burl');
    const r = { frame: frame, cons: cons, rid: null, last: null, count: 0, ran: false };
    function empty(){
      cons.innerHTML = '<div class="console-empty">Console kosong — coba berinteraksi dengan preview di atas.</div>';
      r.count = 0;
    }
    r.clear = empty;
    r.log = function(type, parts){
      if(r.count === 0) cons.innerHTML = '';
      r.count++;
      const div = document.createElement('div');
      const cls = type === 'error' ? 'console-error' : type === 'warn' ? 'console-warn' : type === 'sys' ? 'console-sys' : 'console-out';
      div.className = 'console-line ' + cls;
      (parts || []).forEach(function(p, i){
        if(i) div.appendChild(document.createTextNode(' '));
        const s = document.createElement('span');
        s.className = (type === 'log') ? ('c-' + (p.k || 'str')) : '';
        s.textContent = p.s;
        div.appendChild(s);
      });
      cons.appendChild(div);
      while(cons.children.length > MAX_LINES) cons.removeChild(cons.firstChild);
      cons.scrollTop = cons.scrollHeight;
    };
    r.sys = function(text){ r.log('sys', [{s:text, k:'str'}]); };
    r.run = function(opts, keepConsole){
      if(r.rid) delete runs[r.rid];
      const rid = 'r' + (++runSeq);
      r.rid = rid; runs[rid] = r; r.last = opts; r.ran = true;
      if(!keepConsole) empty();
      if(burl) burl.textContent = url || 'index.html';
      frame.srcdoc = buildDoc(opts, rid);
    };
    const clearBtn = root.querySelector('[data-clear]');
    if(clearBtn) clearBtn.addEventListener('click', empty);
    empty();
    return r;
  }

  window.addEventListener('message', function(e){
    const d = e.data;
    if(!d || !d.__dom5) return;
    const r = runs[d.__dom5];
    if(!r || e.source !== r.frame.contentWindow) return;
    if(d.type === 'check'){ if(r.last && r.last.onCheck) r.last.onCheck(d.res || []); return; }
    if(d.type === 'reload'){ r.sys('— halaman dimuat ulang —'); const o = Object.assign({}, r.last); delete o.check; r.run(o, true); return; }
    if(d.type === 'nav'){ if(r.frame.parentElement){ const u = r.frame.parentElement.querySelector('.burl'); if(u) u.textContent = d.href; } return; }
    r.log(d.type, d.parts);
  });

      + '<div class="browser"><div class="browser-bar"><span class="bdot"></span><span class="bdot"></span><span class="bdot"></span>'

      + '<iframe class="browser-frame" title="Preview halaman" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>'
      + '<div class="console-box"><div class="console-head"><span>Console</span><button data-clear>bersihkan</button></div><div class="console-body"></div></div>'
      + '</div>';

  const agendaHTML = `

  /* =====================================================================
     Render slide
     ===================================================================== */
  function renderControls(topic){
    return topic.controls.map(function(ctrl){
      const btns = ctrl.options.map(function(o){ return '<button class="choice'+(o.value===ctrl.initial?' on':'')+'" data-value="'+o.value+'">'+esc(o.label)+'</button>'; }).join('');
      return '<div class="control-group"><label>'+ctrl.label+'</label><div class="choice-row" data-prop="'+ctrl.prop+'">'+btns+'</div></div>';
    }).join('');
  }

  function renderTopic(topic, n){
    let html = '<section class="slide" id="intro-'+topic.id+'">';
    html += '<div class="tag">'+topic.label+'</div><h2 class="sub">'+topic.title+'</h2>';
    html += '<div class="intro-layout"><div class="intro-text">'+topic.intro+'</div><div class="intro-visual">'+topic.icon+'</div></div>';
    html += '</section>';

    html += '<section class="slide" data-example="'+topic.id+'">';
    html += '<div class="tag tag-muted">'+topic.title+' — Contoh interaktif (kode benar-benar dijalankan)</div>';
    html += '<div class="example-layout">';
    html += '<div class="ex-controls">'+renderControls(topic)+(topic.tip?'<p class="hint-line">'+topic.tip+'</p>':'')+'</div>';
    html += '<div><div class="example-col-label">Kode JavaScript</div><div class="code-panel" data-code></div></div>';
    html += '<div><div class="example-col-label">Halaman &amp; Console — interaktif</div>'+browserHTML(topic.url)+'</div>';
    html += '</div></section>';

    topic.quiz.shuffled = shuffle(topic.quiz.options);
    html += '<section class="slide qc-slide" data-quiz="'+topic.id+'">';
    html += '<div class="tag tag-mint">Cek pemahaman · '+topic.title+'</div>';
    html += '<h2 class="sub">'+topic.quiz.question+'</h2>';
    html += '<div class="qc-options">'+topic.quiz.shuffled.map(function(o,i){ return '<button class="qc-option" data-idx="'+i+'">'+esc(o.label)+'</button>'; }).join('')+'</div>';
    html += '<p class="qc-feedback"></p>';
    html += '</section>';

    const lab = topic.lab;
    html += '<section class="slide lab-slide" data-lab="'+topic.id+'" id="lab-'+topic.id+'">';
    html += '<div class="lab-head"><div class="tag">Live Coding Lab '+n+' / '+topics.length+'</div><h2 class="sub">'+lab.title+'</h2></div>';
    html += '<div class="lab-layout">';
    html += '<div class="lab-task"><p>'+lab.desc+'</p><ol>'+lab.steps.map(function(s){ return '<li>'+s+'</li>'; }).join('')+'</ol>';
    const hints = [lab.hint].concat(HINTS[topic.id] || []);
    html += '<div class="lab-actions"><button class="lab-btn check" data-act="check">✓ Cek Jawaban</button><button class="lab-btn" data-act="hint">💡 Hint 1/'+hints.length+'</button></div>';
    html += '<div class="hint-msg" aria-live="polite"></div>';
    html += '<div class="lab-hints">' + hints.map(function(h, k){ return '<div class="lab-hint" data-hint="'+k+'" hidden><b>Hint '+(k+1)+'</b> · '+h+'</div>'; }).join('') + '</div>';
    html += '<div class="lab-pass-banner">Lab lolos ✓ — mantap!</div><ul class="lab-result"></ul></div>';
    html += '<div class="editor-col"><div class="editor-toolbar">'
      + '<button class="ed-tab on" data-tab="js">app.js</button><button class="ed-tab" data-tab="html">index.html</button><span class="spacer"></span>'
      + '<label class="autorun"><input type="checkbox" data-autorun checked> auto-run</label>'
      + '<button class="lab-btn" data-act="reset" title="Kembalikan kode awal">↺ Reset</button>'
      + '<button class="lab-btn primary" data-act="run" title="Ctrl/⌘ + Enter">▶ Jalankan</button></div>'
      + '<div class="editor"><pre class="ed-hl" aria-hidden="true"></pre><textarea class="ed-ta" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor kode"></textarea></div>'
      + '<div class="editor-foot"><kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>Enter</kbd> jalankan · <kbd>Tab</kbd> indentasi · <kbd>Enter</kbd> auto-indent</div></div>';
    html += '<div class="lab-preview">'+browserHTML(lab.url)+'</div>';
    html += '</div></section>';
    return html;
  }

  let slidesHTML = '';
  let topicN = 0;
  deckPlan.forEach(function(entry){
    slidesHTML += entry.kind==='static' ? entry.html : renderTopic(topicById[entry.id], ++topicN);
  });
  document.getElementById('slides').innerHTML = slidesHTML;

  /* =====================================================================
     Theme & fullscreen (sama seperti Minggu 4)
     ===================================================================== */
  const themeToggle = document.getElementById('themeToggle');
  const sunIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><span>Light</span>';
  const moonIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span>Dark</span>';
  let isLight = false;
  themeToggle.addEventListener('click', function(){
    isLight = !isLight;
    document.documentElement.classList.toggle('light-theme', isLight);
    themeToggle.innerHTML = isLight ? moonIcon : sunIcon;
  });

  const fsToggle = document.getElementById('fsToggle');
  const fsEnterIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg><span>Layar Penuh</span>';
  const fsExitIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg><span>Keluar Penuh</span>';
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(function(){});
    } else if(document.exitFullscreen){
      document.exitFullscreen().catch(function(){});
    }
  }
  fsToggle.addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', function(){
    fsToggle.innerHTML = document.fullscreenElement ? fsExitIcon : fsEnterIcon;
  });

  /* =====================================================================
     Contoh interaktif: kode → panel + dijalankan di preview
     ===================================================================== */
  const exampleRunners = {};
  function codePanelHTML(lines){
    const clean = lines.map(function(l){ return l.charAt(0)==='!' ? l.slice(1) : l; });
    const hl = hlJS(clean.join('\n')).split('\n');
    return '<pre class="hl-code">' + hl.map(function(h, i){
      return '<span class="ln'+(lines[i].charAt(0)==='!'?' cs-hl':'')+'">'+(h || ' ')+'</span>';
    }).join('') + '</pre>';
  }

  topics.forEach(function(topic){
    const section = document.querySelector('[data-example="'+topic.id+'"]');
    const codeEl = section.querySelector('[data-code]');
    const runner = makeRunner(section, topic.url);
    const state = {};
    topic.controls.forEach(function(c){ state[c.prop] = c.initial; });
    const html = block(topic.exHTML);
    const helper = topic.helper ? block(topic.helper) : '';

    function update(run){
      const lines = topic.code(state);
      codeEl.innerHTML = codePanelHTML(lines);
      if(run) runner.run({ html: html, helper: helper, js: lines.map(function(l){ return l.charAt(0)==='!' ? l.slice(1) : l; }).join('\n') });
    }
    section.querySelectorAll('.choice-row').forEach(function(group){
      const prop = group.dataset.prop;
      group.addEventListener('click', function(e){
        const btn = e.target.closest('.choice'); if(!btn) return;
        group.querySelectorAll('.choice').forEach(function(b){ b.classList.remove('on'); });
        btn.classList.add('on');
        state[prop] = btn.dataset.value;
        update(true);
      });
    });
    section.querySelector('[data-rerun]').addEventListener('click', function(){ update(true); });
    update(false);
    exampleRunners[topic.id] = { runner: runner, run: function(){ update(true); } };
  });

  /* =====================================================================
     Live Coding Lab
     ===================================================================== */
  const labs = {};
  const labBadge = document.getElementById('labBadge');
  function updateBadge(){
    const passed = Object.keys(labs).filter(function(k){ return labs[k].passed; }).length;
    labBadge.textContent = 'Lab ✓ ' + passed + '/' + topics.length;
  }

  function insertText(ta, text){
    ta.focus();
    let ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch(e){ ok = false; }
    if(!ok){
      ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input'));
    }
  }

  topics.forEach(function(topic){
    const id = topic.id;
    const section = document.getElementById('lab-'+id);
    const ta = section.querySelector('.ed-ta');
    const pre = section.querySelector('.ed-hl');
    const autorun = section.querySelector('[data-autorun]');
    const resultEl = section.querySelector('.lab-result');
    const runner = makeRunner(section, topic.lab.url);
    const starter = { html: block('lab-'+id+'-html'), js: block('lab-'+id+'-js') };
    const lab = { html: starter.html, js: starter.js, tab: 'js', passed: false, runner: runner, started: false, hintDibuka: 0, cekSejakHint: false };
    labs[id] = lab;

    function paint(){
      pre.innerHTML = (lab.tab === 'html' ? hlHTML(ta.value) : hlJS(ta.value)) + '\n ';
      pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft;
    }
    function load(){
      ta.value = lab[lab.tab];
      ta.scrollTop = 0; ta.scrollLeft = 0;
      paint();
    }
    function run(){
      lab[lab.tab] = ta.value;
      lab.started = true;
      runner.run({ html: lab.html, js: lab.js });
    }
    function check(){
      lab.cekSejakHint = true;
      if(hintMsg) hintMsg.textContent = '';
      lab[lab.tab] = ta.value;
      lab.started = true;
      resultEl.innerHTML = '<li style="color:var(--muted)">Menjalankan auto-check…</li>';
      runner.run({ html: lab.html, js: lab.js, check: block('lab-'+id+'-check'), onCheck: function(res){
        resultEl.innerHTML = '';
        res.forEach(function(r){
          const li = document.createElement('li');
          li.className = r[0] ? 'ok' : 'no';
          li.textContent = r[1];
          resultEl.appendChild(li);
        });
        const allOk = res.length > 0 && res.every(function(r){ return r[0]; });
        runner.sys(allOk ? '— auto-check: semua lolos ✓ —' : '— auto-check selesai: ' + res.filter(function(r){ return !r[0]; }).length + ' belum lolos —');
        if(allOk && !lab.passed){
          lab.passed = true;
          section.classList.add('lab-passed');
          const di = slides.indexOf(section);
          if(dots[di]) dots[di].classList.add('passed-dot');
          updateBadge();
        }
      }});
      runner.sys('— auto-check: halaman dimuat ulang & disimulasikan —');
    }
    lab.run = run;

    let timer = null;
    ta.addEventListener('input', function(){
      lab[lab.tab] = ta.value;
      paint();
      if(autorun.checked){
        clearTimeout(timer);
        timer = setTimeout(run, 750);
      }
    });
    ta.addEventListener('scroll', function(){ pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; });
    ta.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); clearTimeout(timer); run(); return; }
      if(e.key === 's' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); clearTimeout(timer); run(); return; }
      if(e.key === 'Tab' && !e.shiftKey){ e.preventDefault(); insertText(ta, '  '); return; }
      if(e.key === 'Enter' && !e.shiftKey && !e.altKey){
        const before = ta.value.slice(0, ta.selectionStart);
        const line = before.slice(before.lastIndexOf('\n') + 1);
        let indent = line.match(/^\s*/)[0];
        if(/[{(\[]\s*$/.test(line) || (lab.tab === 'html' && /<[a-z][^\/>]*>\s*$/i.test(line) && !/<(input|img|br|hr|meta|link)\b/i.test(line))) indent += '  ';
        e.preventDefault();
        insertText(ta, '\n' + indent);
      }
    });

    section.querySelectorAll('.ed-tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        lab[lab.tab] = ta.value;
        lab.tab = tab.dataset.tab;
        section.querySelectorAll('.ed-tab').forEach(function(t){ t.classList.toggle('on', t === tab); });
        load();
      });
    });
    section.querySelector('[data-act="run"]').addEventListener('click', function(){ clearTimeout(timer); run(); });
    section.querySelector('[data-rerun]').addEventListener('click', function(){ clearTimeout(timer); run(); });
    section.querySelector('[data-act="check"]').addEventListener('click', function(){ clearTimeout(timer); check(); });
    section.querySelector('[data-act="reset"]').addEventListener('click', function(){
      if(!confirm('Kembalikan kode app.js dan index.html ke kondisi awal?')) return;
      lab.html = starter.html; lab.js = starter.js;
      load(); run();
      resultEl.innerHTML = '';
    });
    // Hint bertahap: hint berikutnya terbuka setelah mencoba Cek Jawaban
    const hintBtn = section.querySelector('[data-act="hint"]');
    const hintEls = section.querySelectorAll('[data-hint]');
    const hintMsg = section.querySelector('.hint-msg');
    hintBtn.addEventListener('click', function(){
      if(lab.hintDibuka >= hintEls.length) return;
      if(lab.hintDibuka > 0 && !lab.cekSejakHint){
        hintMsg.textContent = 'Coba terapkan hint sebelumnya lalu tekan ✓ Cek Jawaban dulu — setelah itu hint berikutnya terbuka.';
        return;
      }
      hintMsg.textContent = '';
      hintEls[lab.hintDibuka].hidden = false;
      lab.hintDibuka++;
      lab.cekSejakHint = false;
      hintBtn.textContent = lab.hintDibuka < hintEls.length ? '💡 Hint ' + (lab.hintDibuka + 1) + '/' + hintEls.length : 'Semua hint terbuka';
      hintBtn.disabled = lab.hintDibuka >= hintEls.length;
    });
    load();
  });

  /* ---------- Challenge demo ---------- */
  const chWrap = document.querySelector('[data-challenge]');
  const chRunner = makeRunner(chWrap, 'demo · task-tracker/index.html');
  function runChallenge(){ chRunner.run({ html: block('challenge-html'), js: block('challenge-js') }); }
  chWrap.querySelector('[data-rerun]').addEventListener('click', runChallenge);

  /* =====================================================================
     Kuis (hard gate) — sama seperti Minggu 4
     ===================================================================== */
  const COOLDOWN = 7;
  topics.forEach(function(topic){
    const quizSection = document.querySelector('[data-quiz="'+topic.id+'"]');
    const feedback = quizSection.querySelector('.qc-feedback');
    let answered = false;
    let cooldownTimer = null;
    function clearTimer(){ if(cooldownTimer){ clearInterval(cooldownTimer); cooldownTimer = null; } }
    function resetQuiz(){
      clearTimer();
      quizSection.querySelectorAll('.qc-option').forEach(function(b){ b.classList.remove('correct','wrong','locked'); });
      feedback.textContent = ''; feedback.className = 'qc-feedback';
      answered = false;
    }
    quizSection.querySelectorAll('.qc-option').forEach(function(btn){
      btn.addEventListener('click', function(){
        if(answered) return;
        answered = true;
        clearTimer();
        quizSection.querySelectorAll('.qc-option').forEach(function(b){ b.classList.add('locked'); });
        const chosen = topic.quiz.shuffled[parseInt(btn.dataset.idx, 10)];
        if(chosen.correct){
          btn.classList.add('correct');
          feedback.className = 'qc-feedback good';
          feedback.textContent = 'Betul — ' + topic.quiz.explain;
          quizSection.classList.add('passed');
          const di = slides.indexOf(quizSection);
          if(dots[di]) dots[di].classList.add('passed-dot');
          updateNextState();
        } else {
          btn.classList.add('wrong');
          let remaining = COOLDOWN;
          feedback.className = 'qc-feedback bad';
          feedback.textContent = 'Belum tepat. Pelajari lagi materinya — kembali otomatis dalam ' + remaining + 's…';
          cooldownTimer = setInterval(function(){
            remaining--;
            const stillHere = slides[idx] === quizSection;
            if(remaining > 0){
              if(stillHere) feedback.textContent = 'Belum tepat. Pelajari lagi materinya — kembali otomatis dalam ' + remaining + 's…';
            } else {
              clearTimer();
              resetQuiz();
              if(stillHere) goToId('intro-'+topic.id);
            }
          }, 1000);
        }
      });
    });
  });

  /* =====================================================================
     Navigasi dengan quiz gate
     ===================================================================== */
  const slides = Array.from(document.querySelectorAll('.slide'));
  const dotsWrap = document.getElementById('dots');
  const curNum = document.getElementById('curNum');
  const totNum = document.getElementById('totNum');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const mobileProgress = document.getElementById('mobileProgress');
  let idx = 0;
  totNum.textContent = slides.length;
  slides[0].classList.add('active');

  function canAdvance(){
    const cur = slides[idx];
    return !(cur.classList.contains('qc-slide') && !cur.classList.contains('passed'));
  }
  function canJumpTo(targetIdx){
    if(targetIdx <= idx) return true;
    for(let j = 0; j < targetIdx; j++){
      if(slides[j].classList.contains('qc-slide') && !slides[j].classList.contains('passed')) return false;
    }
    return true;
  }
  slides.forEach(function(s, i){
    const d = document.createElement('button');
    d.className = 'dot' + (i===0 ? ' on' : '');
    d.title = 'Slide ' + (i+1) + (s.classList.contains('lab-slide') ? ' · Lab' : s.classList.contains('qc-slide') ? ' · Kuis' : '');
    d.addEventListener('click', function(){
      if(!canJumpTo(i)){ shake(); return; }
      goTo(i);
    });
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(dotsWrap.children);

  function updateNextState(){
    const cur = slides[idx];
    const blocked = cur.classList.contains('qc-slide') && !cur.classList.contains('passed');
    nextBtn.classList.toggle('locked', blocked);
    if(blocked){
      nextBtn.textContent = 'Jawab dengan benar untuk lanjut';
    } else {
      nextBtn.innerHTML = 'Berikutnya<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left:6px; vertical-align:-1px;"><polyline points="9 18 15 12 9 6"/></svg>';
    }
  }
  function shake(){
    nextBtn.classList.add('shake');
    setTimeout(function(){ nextBtn.classList.remove('shake'); }, 350);
  }
  // Jalankan preview hanya saat slide-nya dibuka (hemat memori)
  function activate(slide){
    const ex = slide.dataset.example;
    if(ex && !exampleRunners[ex].runner.ran) exampleRunners[ex].run();
    const lb = slide.dataset.lab;
    if(lb && !labs[lb].runner.ran) labs[lb].run();
    if(slide.querySelector('[data-challenge]') && !chRunner.ran) runChallenge();
  }
  function goTo(i){
    if(i < 0 || i >= slides.length) return;
    slides[idx].classList.remove('active'); dots[idx].classList.remove('on');
    idx = i;
    slides[idx].classList.add('active'); dots[idx].classList.add('on');
    curNum.textContent = idx+1;
    if(mobileProgress) mobileProgress.textContent = 'Slide ' + (idx+1) + ' / ' + slides.length;
    prevBtn.disabled = idx===0;
    updateNextState();
    activate(slides[idx]);
  }
  function goToId(id){
    const i = slides.indexOf(document.getElementById(id));
    if(i>=0) goTo(i);
  }
  prevBtn.addEventListener('click', function(){ goTo(idx-1); });
  nextBtn.addEventListener('click', function(){ if(canAdvance()) goTo(idx+1); else shake(); });
  prevBtn.disabled = true;
  if(mobileProgress) mobileProgress.textContent = 'Slide 1 / ' + slides.length;
  updateNextState();
  updateBadge();

  document.addEventListener('keydown', function(e){
    if(['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){
      if(e.target.tagName === 'BUTTON' && e.key === ' ') return;
      if(e.key === ' ') e.preventDefault();
      if(canAdvance()) goTo(idx+1); else shake();
    }
    if(e.key === 'ArrowLeft' || e.key === 'PageUp') goTo(idx-1);
    if(e.key === 'f' || e.key === 'F') toggleFullscreen();
  });

  let touchStartX = 0, touchStartY = 0, touchIgnore = false;
  document.addEventListener('touchstart', function(e){
    touchIgnore = !!(e.target.closest && e.target.closest('.editor, .code-panel, .console-body, .browser'));
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });
  document.addEventListener('touchend', function(e){
    if(touchIgnore) return;
    const diffX = e.changedTouches[0].screenX - touchStartX;
    const diffY = e.changedTouches[0].screenY - touchStartY;
    if(Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)){
      if(diffX < 0){ if(canAdvance()) goTo(idx+1); else shake(); }
      else goTo(idx-1);
    }
  }, { passive: true });
})();
</script>
</body>
</html>
