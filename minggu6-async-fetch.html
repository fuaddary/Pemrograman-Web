<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Modul Kuliah Interaktif Minggu 6: Asynchronous JavaScript & Fetch API — sinkron vs asinkron, event loop (visualizer), callback, Promise, async/await, JSON, fetch GET/POST, status HTTP & error handling, Promise.all, serta pola UI loading/error/debounce/AbortController. Dilengkapi Live Coding Lab dengan auto-check dan Mock REST API.">
  <title>Minggu 6 · Asynchronous JavaScript &amp; Fetch API — Pemrograman Web ET234305</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0E2438;
      --panel: #123253;
      --panel-2: #1B3E60;
      --surface: #1B3E60;
      --line: #3C6E8F;
      --line-soft: rgba(74, 144, 184, 0.22);
      --text: #EAF2F6;
      --muted: #8FB2C8;
      --amber: #F2A93B;
      --coral: #E8654A;
      --mint: #5FC7A3;
      --on-text: #0E2438;
      --radius: 10px;
    }

    html.light-theme {
      --bg: #F6F8FA;
      --panel: #EAF0F5;
      --panel-2: #DCE6EE;
      --surface: #FFFFFF;
      --line: #B7C9D6;
      --line-soft: rgba(60, 110, 143, 0.18);
      --text: #132A3E;
      --muted: #5D7A91;
      --amber: #B8690A;
      --coral: #B23A26;
      --mint: #1F7A5C;
      --on-text: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      overflow: hidden;
      transition: background .2s ease, color .2s ease;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      opacity: .6;
      z-index: 0;
    }

    .deck {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 36px;
      border-bottom: 1px solid var(--line-soft);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .topbar .crumb b {
      color: var(--text);
      font-weight: 500;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background .15s ease;
    }

    .theme-toggle:hover {
      background: var(--panel-2);
    }

    .slides {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 40px 60px 30px;
      display: none;
      flex-direction: column;
      justify-content: safe center;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .slide.active {
      display: flex;
    }

    h1.headline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.1;
      margin: 0 0 14px;
      max-width: 16ch;
      color: var(--text);
    }

    h2.sub {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: clamp(19px, 2.2vw, 26px);
      margin: 0 0 16px;
      color: var(--text);
    }

    p.lede {
      font-size: 16px;
      line-height: 1.65;
      color: var(--muted);
      max-width: 68ch;
      margin: 0 0 14px;
    }

    .tag {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      border-radius: 20px;
      padding: 4px 12px;
      margin-bottom: 16px;
      width: fit-content;
      background: color-mix(in srgb, var(--amber) 12%, transparent);
      color: var(--amber);
      border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    }

    .tag-mint {
      background: color-mix(in srgb, var(--mint) 12%, transparent);
      color: var(--mint);
      border-color: color-mix(in srgb, var(--mint) 40%, transparent);
    }

    .tag-coral {
      background: color-mix(in srgb, var(--coral) 10%, transparent);
      color: var(--coral);
      border-color: color-mix(in srgb, var(--coral) 35%, transparent);
    }

    .tag-muted {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 36px;
      border-top: 1px solid var(--line-soft);
      flex-shrink: 0;
    }

    .navbtn {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }

    .navbtn:hover {
      background: var(--panel-2);
    }

    .navbtn:disabled {
      opacity: .35;
      cursor: default;
    }

    .navbtn.locked {
      opacity: .7;
    }

    .navbtn.shake {
      animation: shake .35s ease;
    }

    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }

    .navbtn:focus-visible,
    button:focus-visible,
    .choice:focus-visible,
    .qc-option:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      max-width: 44vw;
      justify-content: center;
      align-items: center;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--line);
      cursor: pointer;
      border: none;
      padding: 0;
      transition: all .2s ease;
    }

    .dot.on {
      background: var(--amber);
      width: 16px;
      border-radius: 4px;
    }

    .dot.passed-dot {
      background: var(--mint);
    }

    .mobile-nav-label {
      display: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .col {
      flex: 1;
      min-width: 260px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 20px;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
    }

    code,
    .mono-code,
    p code,
    li code,
    span.mono:not(.range-val) {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.88em;
      background: color-mix(in srgb, var(--amber) 15%, var(--panel));
      color: var(--amber);
      border: 1px solid color-mix(in srgb, var(--amber) 34%, transparent);
      padding: 1.5px 6.5px;
      border-radius: 5px;
      font-weight: 500;
      letter-spacing: -0.2px;
      display: inline-block;
      vertical-align: middle;
      line-height: 1.3;
      margin: 0 1.5px;
    }

    pre code,
    pre.snippet code {
      background: transparent;
      border: none;
      padding: 0;
      color: inherit;
      font-size: inherit;
      font-weight: normal;
    }

    .footer-note {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .two-col-gap {
      display: flex;
      gap: 44px;
      flex-wrap: wrap;
    }

    .cpmk {
      margin-top: 24px;
      display: flex;
      gap: 26px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .cpmk b {
      color: var(--mint);
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .credit-line {
      margin-top: 26px;
      font-size: 13px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .credit-line b {
      color: var(--text);
      font-weight: 500;
    }

    .agenda-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 0 36px;
    }

    .agenda-list li {
      display: flex;
      gap: 16px;
      align-items: baseline;
      padding: 8px 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .agenda-list .num {
      font-family: 'IBM Plex Mono', monospace;
      color: var(--amber);
      font-size: 13px;
      width: 22px;
    }

    .agenda-list .txt {
      font-size: 14px;
    }

    .agenda-list .txt small {
      display: block;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 1px;
    }

    .intro-layout {
      display: flex;
      gap: 40px;
      align-items: center;
      flex-wrap: wrap;
    }

    .intro-text {
      flex: 1.35;
      min-width: 300px;
    }

    .intro-visual {
      flex: 1;
      min-width: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro-visual svg {
      width: 100%;
      max-width: 230px;
      height: auto;
    }

    .key-points {
      list-style: none;
      margin: 14px 0 0;
      padding: 0;
      max-width: 66ch;
    }

    .key-points li {
      position: relative;
      padding: 4px 0 4px 18px;
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.5;
    }

    .key-points li:before {
      content: "–";
      position: absolute;
      left: 0;
      color: var(--amber);
      font-weight: 600;
    }

    .ic-amber {
      stroke: var(--amber);
      fill: none;
    }

    .ic-coral {
      stroke: var(--coral);
      fill: none;
    }

    .ic-mint {
      stroke: var(--mint);
      fill: none;
    }

    .ic-line {
      stroke: var(--line);
      fill: none;
    }

    .ic-fill-amber {
      fill: var(--amber);
    }

    .ic-fill-coral {
      fill: var(--coral);
    }

    .ic-fill-mint {
      fill: var(--mint);
    }

    .ic-fill-soft {
      fill: var(--surface);
      stroke: var(--line);
    }

    .ic-text {
      fill: var(--text);
      stroke: var(--text);
    }

    .ic-muted {
      fill: var(--muted);
      stroke: none;
    }

    .ic-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
    }

    .control-group {
      margin-bottom: 14px;
    }

    .control-group label {
      display: block;
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .choice-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .choice {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 12px;
      padding: 6px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'IBM Plex Mono';
      transition: all .15s ease;
    }

    .choice.on {
      background: var(--amber);
      color: var(--on-text);
      border-color: var(--amber);
      font-weight: 500;
    }

    .example-layout {
      display: grid;
      grid-template-columns: 210px 1fr 1fr;
      gap: 22px;
      flex: 1;
      min-height: 0;
    }

    .example-col-label {
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .ex-controls {
      display: flex;
      flex-direction: column;
    }

    .code-panel {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 14px;
      font-family: 'IBM Plex Mono';
      font-size: 12.5px;
      line-height: 1.8;
      overflow: auto;
      height: calc(100% - 24px);
    }

    .cs-block {
      margin-bottom: 10px;
    }

    .cs-sel {
      color: #EAF2F6;
    }

    .cs-line {
      padding-left: 0;
    }

    .cs-line.cs-hl {
      background: rgba(242, 169, 59, 0.18);
      border-radius: 4px;
      margin: 0 -6px;
      padding: 2px 6px;
    }

    .cs-kw {
      color: #7FD9BB;
    }

    .cs-val {
      color: #F2B25E;
    }

    .cs-com {
      color: #6C8AA1;
      font-style: italic;
    }

    .cs-fn {
      color: #8FC7FF;
    }

    .console-line {
      padding: 2px 0;
      white-space: pre-wrap;
    }

    .console-line:before {
      content: "› ";
      color: #4F7089;
    }

    .console-out {
      color: #EAF2F6;
    }

    .console-error {
      color: #FF8A75;
    }

    .console-error:before {
      content: "✕ ";
      color: #FF8A75;
    }

    .console-value {
      color: #F2B25E;
    }

    .console-good {
      color: #7FD9BB;
    }

    .ex-result {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      height: calc(100% - 24px);
    }

    @media (max-width:900px) {
      .example-layout {
        grid-template-columns: 1fr;
        height: auto;
      }

      .code-panel {
        height: auto;
      }
    }

    .pattern-card {
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      background: var(--panel);
    }

    .pattern-title {
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      color: var(--mint);
      margin-bottom: 10px;
    }

    pre.snippet {
      margin: 10px 0 0;
      white-space: pre-wrap;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      color: var(--muted);
      background: var(--panel-2);
      padding: 10px 12px;
      border-radius: 6px;
    }

    .challenge-mock {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 16px;
      font-family: 'IBM Plex Mono';
      font-size: 12.5px;
      color: #EAF2F6;
      line-height: 1.7;
    }

    /* Step by Step Guide Card for Challenge */
    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .step-card {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .step-num {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--amber);
      background: color-mix(in srgb, var(--amber) 15%, transparent);
      border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
      padding: 1.5px 7px;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .step-card h3 {
      margin: 0 0 4px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
    }

    .step-card p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .checklist {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .checklist li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 6px 0;
      font-size: 14px;
    }

    .checklist li:before {
      content: "-";
      color: var(--amber);
      font-family: 'IBM Plex Mono';
      font-weight: 600;
    }

    /* Live Calculator Demo Box */
    .calc-tester {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .calc-inputs {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .calc-input {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono';
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 6px;
      width: 80px;
    }

    .calc-select {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--amber);
      font-family: 'IBM Plex Mono';
      font-size: 14px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .calc-btn {
      background: var(--amber);
      color: var(--on-text);
      border: none;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity .15s ease;
    }

    .calc-btn:hover {
      opacity: .9;
    }

    .calc-out-box {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 10px 12px;
      font-family: 'IBM Plex Mono';
      font-size: 12px;
      min-height: 38px;
      display: flex;
      align-items: center;
    }

    .qc-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 600px;
    }

    .qc-option {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'IBM Plex Sans';
      font-size: 15px;
      transition: background .15s ease, border-color .15s ease;
    }

    .qc-option:hover {
      background: var(--panel-2);
    }

    .qc-option.correct {
      background: color-mix(in srgb, var(--mint) 15%, transparent);
      border-color: var(--mint);
    }

    .qc-option.wrong {
      background: color-mix(in srgb, var(--coral) 15%, transparent);
      border-color: var(--coral);
    }

    .qc-option.locked {
      cursor: default;
      pointer-events: none;
    }

    .qc-feedback {
      margin-top: 16px;
      font-size: 14px;
      min-height: 20px;
      max-width: 600px;
      line-height: 1.5;
    }

    .qc-feedback.good {
      color: var(--mint);
    }

    .qc-feedback.bad {
      color: var(--coral);
    }

    @media (max-width:760px) {
      .slide {
        padding: 24px 18px 18px;
        justify-content: flex-start;
      }

      .topbar,
      .navbar {
        padding: 12px 16px;
      }

      .topbar .crumb {
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 48vw;
      }

      .row,
      .two-col-gap {
        gap: 16px;
      }

      .dots {
        display: none;
      }

      .mobile-nav-label {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }

    /* ================= Minggu 5 additions: live preview, console, live coding lab ================= */
    .counter { font-family: 'IBM Plex Mono', monospace; }

    .lab-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 5px 11px;
      border-radius: 20px;
      border: 1px solid color-mix(in srgb, var(--mint) 45%, transparent);
      color: var(--mint);
      background: color-mix(in srgb, var(--mint) 10%, transparent);
      white-space: nowrap;
    }

    /* highlight tokens (shared by code panels and editor) */
    .tk-kw { color: #7FD9BB; }
    .tk-str { color: #F2B25E; }
    .tk-num { color: #F2B25E; }
    .tk-com { color: #6C8AA1; font-style: italic; }
    .tk-fn { color: #8FC7FF; }
    .tk-tag { color: #FF9E80; }
    .tk-attr { color: #8FC7FF; }
    .tk-punc { color: #8FB2C8; }

    .code-panel pre.hl-code {
      margin: 0;
      font: inherit;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
      color: #EAF2F6;
    }
    .code-panel .ln { display: block; padding: 0 6px; margin: 0 -6px; border-radius: 4px; min-height: 1.8em; }

    /* result column: browser mock + console */

      gap: 6px;
      padding: 6px 10px;
      background: #E7EDF2;
      border-bottom: 1px solid #CBD7E0;

    .bdot { width: 9px; height: 9px; border-radius: 50%; background: #C6D2DB; }
    .bdot:nth-child(1) { background: #E8654A; }
    .bdot:nth-child(2) { background: #F2A93B; }

    .burl {

      border-radius: 5px;

      padding: 1px 8px;

    }
    .brun:hover { background: #FFFFFF; }
    .browser-frame { flex: 1; width: 100%; border: 0; background: #FFFFFF; min-height: 140px; }

    .console-box {
      height: 138px;

      display: flex;
      flex-direction: column;
      background: #0A1B2C;
      border: 1px solid var(--line-soft);

      overflow: hidden;

    .console-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 12px;
      border-bottom: 1px solid rgba(74, 144, 184, 0.22);

      font-size: 11px;
      color: #8FB2C8;
      flex-shrink: 0;

    .console-head button {
      background: transparent;
      border: 1px solid #3C6E8F;
      color: #8FB2C8;
      border-radius: 4px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      padding: 1px 7px;
      cursor: pointer;
    }
    .console-body {
      flex: 1;
      overflow: auto;
      padding: 6px 12px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #EAF2F6;
    }
    .console-body .console-line { border-bottom: 1px solid rgba(74, 144, 184, 0.10); }
    .console-warn { color: #F2C66D; }
    .console-warn:before { content: "⚠ " !important; color: #F2C66D !important; }
    .console-sys { color: #6C8AA1; font-style: italic; }
    .console-sys:before { content: "· " !important; }
    .c-str { color: #EAF2F6; }
    .c-val { color: #F2B25E; }
    .c-el { color: #FF9E80; }
    .c-muted { color: #8FB2C8; }
    .console-empty { color: #4F7089; font-style: italic; }

    .hint-line {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.5;
    }
    .hint-line b { color: var(--amber); font-weight: 600; }

    /* ================= Live Coding Lab ================= */
    .slide.lab-slide {
      justify-content: flex-start;
      padding: 20px 36px 16px;
    }
    .lab-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .lab-head .tag { margin-bottom: 0; }
    .lab-head h2.sub { margin: 0; }
    .lab-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 260px minmax(0, 1.12fr) minmax(0, 1fr);
      gap: 16px;
    }
    .lab-task {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 14px 15px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .lab-task p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--text); }
    .lab-task ol {
      margin: 0;
      padding-left: 18px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }
    .lab-task ol li { margin-bottom: 5px; }
    .lab-task ol li b { color: var(--text); font-weight: 600; }
    .lab-hint {
      font-size: 12px;
      color: var(--muted);
      border-left: 2px solid var(--amber);
      padding: 2px 0 2px 10px;
      line-height: 1.5;
    }
    .lab-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .lab-btn {
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s ease, opacity .15s ease;
    }
    .lab-btn:hover { background: var(--surface); }
    .lab-btn.primary {
      background: var(--amber);
      border-color: var(--amber);
      color: var(--on-text);
      font-weight: 600;
    }
    .lab-btn.primary:hover { opacity: .9; }
    .lab-btn.check {
      background: color-mix(in srgb, var(--mint) 18%, var(--panel));
      border-color: var(--mint);
      color: var(--mint);
      font-weight: 600;
    }
    .lab-result { list-style: none; margin: 0; padding: 0; font-size: 12.5px; line-height: 1.45; }
    .lab-result li { padding: 3px 0 3px 20px; position: relative; }
    .lab-result li.ok { color: var(--mint); }
    .lab-result li.no { color: var(--coral); }
    .lab-result li.ok:before { content: "✓"; position: absolute; left: 2px; font-weight: 700; }
    .lab-result li.no:before { content: "✕"; position: absolute; left: 2px; font-weight: 700; }
    .lab-pass-banner {
      display: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--mint);
      border: 1px solid var(--mint);
      background: color-mix(in srgb, var(--mint) 12%, transparent);
      border-radius: 6px;
      padding: 6px 10px;
    }
    .lab-slide.lab-passed .lab-pass-banner { display: block; }

    .editor-col { display: flex; flex-direction: column; min-height: 0; gap: 8px; }
    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .ed-tab {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      padding: 4px 11px;
      border-radius: 6px 6px 0 0;
      cursor: pointer;
    }
    .ed-tab.on { background: #0A1B2C; color: #EAF2F6; border-color: #3C6E8F; }
    .editor-toolbar .spacer { flex: 1; }
    .autorun {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .autorun input { accent-color: var(--amber); }
    .editor {
      position: relative;
      flex: 1;
      min-height: 240px;
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      overflow: hidden;
    }
    .ed-hl, .ed-ta {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 12px 14px;
      border: 0;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.65;
      letter-spacing: 0;
      tab-size: 2;
      white-space: pre;
      word-wrap: normal;
      overflow: auto;
      box-sizing: border-box;
    }
    .ed-hl { color: #EAF2F6; pointer-events: none; overflow: hidden; }
    .ed-ta {
      z-index: 1;
      resize: none;
      outline: none;
      background: transparent;
      color: transparent;
      -webkit-text-fill-color: transparent;
      caret-color: #F2A93B;
    }
    .ed-ta::selection { background: rgba(242, 169, 59, .32); -webkit-text-fill-color: transparent; }
    .editor-foot {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      color: var(--muted);
    }
    .editor-foot kbd {
      font-family: inherit;
      border: 1px solid var(--line);
      border-radius: 3px;
      padding: 0 4px;
      background: var(--panel);
    }
    .lab-layout > .lab-preview { display: flex; flex-direction: column; min-height: 0; }
    .lab-slide .result-col { flex: 1; height: auto; min-height: 0; }
    .lab-slide .browser { min-height: 200px; }
    .lab-slide .console-box { height: 150px; }

    /* how-to slide */
    .howto-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
      max-width: 1100px;
    }

    /* challenge demo */
    .challenge-demo {
      height: 330px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .req-list { list-style: none; margin: 0; padding: 0; font-size: 13px; }
    .req-list li { padding: 5px 0 5px 22px; position: relative; color: var(--muted); line-height: 1.45; border-bottom: 1px solid var(--line-soft); }
    .req-list li b { color: var(--text); font-weight: 600; }
    .req-list li:before {
      content: attr(data-n);
      position: absolute;
      left: 0;
      top: 5px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--amber);
    }

    @media (max-width: 1100px) {
      .lab-layout { flex: none; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(460px, 1fr); }
      .lab-task { grid-column: 1 / -1; }
    }
    .example-layout > div { min-width: 0; }
    @media (max-width: 900px) {
      .example-layout { grid-template-columns: minmax(0, 1fr); }
      .result-col { height: auto; }
      .browser { min-height: 220px; }
      .lab-layout { display: flex; flex-direction: column; flex: none; }
      .slide.lab-slide { padding: 20px 16px 16px; }
      .editor { flex: none; height: 320px; min-height: 0; }
      .lab-slide .browser { flex: none; height: 260px; }
    }
    @media (max-width: 760px) {
      .lab-badge { display: none; }
    }

    /* ================= Minggu 6 additions: Network tab, event loop visualizer ================= */
    .console-head { padding: 0 6px 0 4px; }
    .ctabs { display: flex; gap: 2px; }
    .ctab {
      background: transparent;
      border: 0 !important;
      border-bottom: 2px solid transparent !important;
      border-radius: 0 !important;
      color: #8FB2C8;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px !important;
      padding: 5px 8px !important;
      cursor: pointer;
    }
    .ctab.on { color: #EAF2F6; border-bottom-color: #F2A93B !important; }
    .ctab .cnt {
      display: inline-block;
      min-width: 16px;
      padding: 0 4px;
      margin-left: 3px;
      border-radius: 8px;
      background: rgba(242, 169, 59, .18);
      color: #F2B25E;
      font-size: 10px;
      text-align: center;
    }
    .net-body { display: none; flex: 1; overflow: auto; padding: 4px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #EAF2F6; }
    .console-box.show-net .net-body { display: block; }
    .console-box.show-net .console-body { display: none; }
    .net-row {
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 62px 58px 90px;
      gap: 8px;
      align-items: center;
      padding: 3px 0;
      border-bottom: 1px solid rgba(74, 144, 184, 0.10);
      font-size: 11.5px;
    }
    .net-head { color: #6C8AA1; font-size: 10.5px; }
    .net-m { color: #8FC7FF; font-weight: 500; }
    .net-u { color: #EAF2F6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .net-s { font-weight: 600; }
    .net-s.s2 { color: #7FD9BB; }
    .net-s.s4 { color: #F2C66D; }
    .net-s.s5, .net-s.sx { color: #FF8A75; }
    .net-s.sp { color: #8FB2C8; font-weight: 400; }
    .net-t { color: #8FB2C8; text-align: right; }
    .net-bar { position: relative; height: 8px; background: rgba(74, 144, 184, .12); border-radius: 4px; overflow: hidden; }
    .net-bar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: #5FC7A3; min-width: 2px; }
    .net-bar i.pending { background: repeating-linear-gradient(90deg, #F2A93B 0 6px, rgba(242, 169, 59, .4) 6px 12px); animation: netpend .6s linear infinite; background-size: 24px 8px; }
    .net-bar i.bad { background: #E8654A; }
    .net-bar i.warn { background: #F2C66D; }
    @keyframes netpend { to { background-position: 24px 0; } }

    .net-select {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      padding: 5px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .editor-toolbar .net-select { max-width: 128px; }
    .browser-bar .net-select { padding: 1px 4px; font-size: 11px; background: #fff; color: #3C5A70; border-color: #C6D2DB; }

    /* -------- Event loop visualizer -------- */
    .viz-layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr) minmax(0, 1.15fr);
      gap: 20px;
      flex: 1;
      min-height: 0;
    }
    .viz-layout > div { min-width: 0; }
    .viz-steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
    .viz-note {
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--amber);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text);
      min-height: 92px;
    }
    .viz-note .viz-count { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .viz-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(80px, 1fr) minmax(70px, .8fr) minmax(70px, .8fr) minmax(90px, 1fr);
      gap: 10px;
      height: calc(100% - 24px);
    }
    .viz-box {
      background: #0A1B2C;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .viz-box h4 {
      margin: 0 0 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10.5px;
      font-weight: 500;
      color: #8FB2C8;
      letter-spacing: .3px;
      display: flex;
      justify-content: space-between;
    }
    .viz-box h4 small { color: #4F7089; font-size: 10px; }
    .viz-box.hot { border-color: #F2A93B; box-shadow: 0 0 0 2px rgba(242, 169, 59, .25); }
    .viz-items { display: flex; flex-direction: column; gap: 5px; overflow: auto; min-height: 0; }
    .viz-box[data-box="stack"] { grid-row: 1 / 4; }
    .viz-box[data-box="stack"] .viz-items { flex: 1; flex-direction: column-reverse; justify-content: flex-start; }
    .viz-box[data-box="out"] { grid-column: 1 / -1; }
    .viz-box[data-box="micro"] .viz-items, .viz-box[data-box="macro"] .viz-items { flex-direction: row; flex-wrap: wrap; }
    .viz-item {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      padding: 4px 8px;
      border-radius: 5px;
      color: #EAF2F6;
      background: #1B3E60;
      border: 1px solid #3C6E8F;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: vizpop .25s ease;
    }
    .viz-box[data-box="stack"] .viz-item { background: rgba(242, 169, 59, .16); border-color: rgba(242, 169, 59, .55); }
    .viz-box[data-box="web"] .viz-item { background: rgba(143, 199, 255, .12); border-color: rgba(143, 199, 255, .5); }
    .viz-box[data-box="micro"] .viz-item { background: rgba(95, 199, 163, .14); border-color: rgba(95, 199, 163, .55); }
    .viz-box[data-box="macro"] .viz-item { background: rgba(232, 101, 74, .14); border-color: rgba(232, 101, 74, .5); }
    .viz-out { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #EAF2F6; overflow: auto; }
    .viz-out div:before { content: "› "; color: #4F7089; }
    .viz-out div.new { color: #F2B25E; }
    .viz-empty { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #3F5B70; font-style: italic; }
    .viz-loop {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
    }
    .viz-loop svg { transition: transform .5s ease; }
    .viz-loop.spin { color: var(--amber); }
    .viz-loop.spin svg { transform: rotate(360deg); }
    @keyframes vizpop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

    .api-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .api-table th, .api-table td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    .api-table th { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); font-weight: 500; }
    .api-table td:first-child { white-space: nowrap; }
    .verb { display: inline-block; min-width: 54px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; }
    .verb.get { color: var(--mint); }
    .verb.post { color: var(--amber); }
    .verb.del { color: var(--coral); }

    @media (max-width: 1100px) {
      .viz-layout { grid-template-columns: 1fr 1fr; }
      .viz-layout > .ex-controls { grid-column: 1 / -1; }
    }
    @media (max-width: 900px) {
      .viz-layout { grid-template-columns: minmax(0, 1fr); }
      .viz-grid { height: auto; grid-template-rows: 90px 80px 80px 110px; }
      .net-row { grid-template-columns: 42px minmax(0, 1fr) 46px 52px; }
      .net-row .net-bar { display: none; }
    }
  </style>
</head>

  <script type="text/plain" data-k="mock-api">
/*!
 * Mock REST API "Kampus" — Pemrograman Web ET234305 (Minggu 6)
 * ------------------------------------------------------------------
 * Mencegat fetch() ke URL berawalan /api/ (atau https://api.kampus.dev/api/)
 * dan menjawab seperti server sungguhan: ada delay jaringan, status code,
 * header, dan body JSON. Tidak butuh internet, tidak ada masalah CORS.
 *
 * Cara pakai di proyek kalian (muat SEBELUM app.js):
 *   <script src="https://fuaddary.github.io/Pemrograman-Web/assets/mock-api-kampus.js"><\/script>
 *   <script src="app.js" defer><\/script>
 *
 * Endpoint:
 *   GET    /api/mahasiswa[?q=&angkatan=]   GET /api/mahasiswa/:nrp
 *   POST   /api/mahasiswa                  PUT|PATCH|DELETE /api/mahasiswa/:nrp
 *   GET    /api/matkul                     GET /api/matkul/:kode
 *   GET    /api/nilai/:nrp                 GET /api/pengumuman
 *   GET    /api/tugas                      POST /api/tugas
 *   PATCH  /api/tugas/:id                  DELETE /api/tugas/:id
 *   GET    /api/lambat?ms=2000             GET /api/rusak   (selalu 500)
 *
 * Simulasi kondisi jaringan (ketik di Console):
 *   __API.setMode("normal" | "lambat" | "tidakstabil" | "offline" | "error500")
 *   __API.gagalkan("/api/pengumuman")   → endpoint tsb. selalu 500
 *   __API.pulihkan()                    → normal kembali
 *   __API.reset()                       → data kembali ke kondisi awal
 *   __API.simpan(true)                  → data disimpan di localStorage
 */
(function () {
  "use strict";
  if (window.__API) return;

  var cfg = Object.assign({ mode: "normal", latency: null, log: true, persist: false }, window.__API_CONFIG || {});
  var realFetch = window.fetch ? window.fetch.bind(window) : null;
  var KEY = "mock-api-kampus:v1";

  var SEED = {
    mahasiswa: [
      { nrp: "5027241001", nama: "Rani Kusuma", angkatan: 2024, ipk: 3.71 },
      { nrp: "5027241002", nama: "Budi Santoso", angkatan: 2024, ipk: 3.12 },
      { nrp: "5027241003", nama: "Citra Lestari", angkatan: 2024, ipk: 3.85 },
      { nrp: "5027231004", nama: "Dimas Pratama", angkatan: 2023, ipk: 2.94 },
      { nrp: "5027231005", nama: "Eka Wulandari", angkatan: 2023, ipk: 3.47 },
      { nrp: "5027221006", nama: "Fajar Nugroho", angkatan: 2022, ipk: 3.3 }
    ],
    matkul: [
      { kode: "ET234305", nama: "Pemrograman Web", sks: 4, semester: 3 },
      { kode: "ET234302", nama: "Basis Data", sks: 3, semester: 3 },
      { kode: "ET234303", nama: "Struktur Data", sks: 3, semester: 3 },
      { kode: "ET234304", nama: "Jaringan Komputer", sks: 3, semester: 3 },
      { kode: "ET234301", nama: "Statistika", sks: 2, semester: 3 }
    ],
    nilai: {
      "5027241001": [{ kode: "ET234305", nilai: 88 }, { kode: "ET234302", nilai: 79 }, { kode: "ET234303", nilai: 91 }],
      "5027241002": [{ kode: "ET234305", nilai: 72 }, { kode: "ET234302", nilai: 65 }, { kode: "ET234301", nilai: 80 }],
      "5027241003": [{ kode: "ET234305", nilai: 95 }, { kode: "ET234304", nilai: 89 }],
      "5027231004": [{ kode: "ET234305", nilai: 58 }, { kode: "ET234303", nilai: 70 }],
      "5027231005": [{ kode: "ET234302", nilai: 84 }],
      "5027221006": []
    },
    pengumuman: [
      { id: 1, judul: "Asistensi Modul 2 dipindah ke Lab KCKS", tanggal: "2026-10-05" },
      { id: 2, judul: "Batas pengumpulan Tugas 1: Jumat 23.59", tanggal: "2026-10-09" },
      { id: 3, judul: "Evaluasi 1 dilaksanakan Minggu 8", tanggal: "2026-10-12" }
    ],
    tugas: [
      { id: 1, judul: "Lab 10 event delegation", matkul: "Pemrograman Web", deadline: "2026-10-08", selesai: false },
      { id: 2, judul: "ERD sistem perpustakaan", matkul: "Basis Data", deadline: "2026-10-12", selesai: true },
      { id: 3, judul: "Ringkasan materi async/await", matkul: "Pemrograman Web", deadline: "2026-10-10", selesai: false }
    ],
    nextTugasId: 4
  };

  var db;
  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function load() {
    db = clone(SEED);
    if (cfg.persist) {
      try { var s = localStorage.getItem(KEY); if (s) db = JSON.parse(s); } catch (e) { /* abaikan */ }
    }
  }
  function save() {
    if (!cfg.persist) return;
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* abaikan */ }
  }
  load();

  var failPaths = [];
  var calls = [];
  var seq = 0;

  function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function latency(path, query) {
    if (path === "/api/lambat") return Math.min(10000, Math.max(0, Number(query.get("ms")) || 2000));
    if (cfg.latency != null) return cfg.latency;
    if (cfg.mode === "lambat") return 1800 + Math.random() * 700;
    if (cfg.mode === "tidakstabil") return 150 + Math.random() * 1450;
    return 250 + Math.random() * 450;
  }
  function err(status, pesan) { return { status: status, data: { error: pesan } }; }
  function ok(data, status) { return { status: status || 200, data: data }; }

  function validMhs(b, partial) {
    if (!partial || "nama" in b) {
      if (typeof b.nama !== "string" || !b.nama.trim()) return "Nama wajib diisi";
      if (b.nama.trim().length > 60) return "Nama maksimal 60 karakter";
    }
    if (!partial) {
      if (!/^\d{10}$/.test(String(b.nrp || ""))) return "NRP harus 10 digit angka";
    }
    if ("ipk" in b && b.ipk !== null && (typeof b.ipk !== "number" || b.ipk < 0 || b.ipk > 4)) return "IPK harus angka 0–4";
    return null;
  }
  function validTugas(b, partial) {
    if (!partial || "judul" in b) {
      if (typeof b.judul !== "string" || b.judul.trim().length < 3) return "Judul minimal 3 karakter";
    }
    if (!partial && !/^\d{4}-\d{2}-\d{2}$/.test(String(b.deadline || ""))) return "Deadline wajib berformat YYYY-MM-DD";
    if ("selesai" in b && typeof b.selesai !== "boolean") return "selesai harus boolean";
    return null;
  }

  function route(method, path, query, body) {
    var m, x, e;
    if (path === "/api/rusak") return err(500, "Internal Server Error (endpoint ini memang selalu gagal)");
    if (path === "/api/lambat") return ok({ pesan: "Akhirnya sampai!", ms: Number(query.get("ms")) || 2000 });

    // ---------- mahasiswa ----------
    if (path === "/api/mahasiswa") {
      if (method === "GET") {
        var q = (query.get("q") || "").trim().toLowerCase();
        var ang = query.get("angkatan");
        return ok(db.mahasiswa.filter(function (s) {
          return (!q || s.nama.toLowerCase().indexOf(q) !== -1 || s.nrp.indexOf(q) === 0) && (!ang || String(s.angkatan) === ang);
        }));
      }
      if (method === "POST") {
        if ((e = validMhs(body, false))) return err(400, e);
        if (db.mahasiswa.some(function (s) { return s.nrp === String(body.nrp); })) return err(409, "NRP " + body.nrp + " sudah terdaftar");
        var baru = { nrp: String(body.nrp), nama: body.nama.trim(), angkatan: 2000 + Number(String(body.nrp).slice(4, 6)), ipk: typeof body.ipk === "number" ? body.ipk : null };
        db.mahasiswa.push(baru); save();
        return ok(baru, 201);
      }
      return err(405, "Method " + method + " tidak didukung di " + path);
    }
    if ((m = path.match(/^\/api\/mahasiswa\/([^/]+)$/))) {
      var i = db.mahasiswa.findIndex(function (s) { return s.nrp === m[1]; });
      if (i === -1) return err(404, "Mahasiswa dengan NRP " + m[1] + " tidak ditemukan");
      if (method === "GET") return ok(db.mahasiswa[i]);
      if (method === "PUT" || method === "PATCH") {
        if ((e = validMhs(body, method === "PATCH"))) return err(400, e);
        if ("nama" in body) db.mahasiswa[i].nama = body.nama.trim();
        if ("ipk" in body) db.mahasiswa[i].ipk = body.ipk;
        save(); return ok(db.mahasiswa[i]);
      }
      if (method === "DELETE") { db.mahasiswa.splice(i, 1); save(); return { status: 204, data: undefined }; }
      return err(405, "Method " + method + " tidak didukung di " + path);
    }

    // ---------- matkul ----------
    if (path === "/api/matkul" && method === "GET") return ok(db.matkul);
    if ((m = path.match(/^\/api\/matkul\/([^/]+)$/)) && method === "GET") {
      x = db.matkul.find(function (k) { return k.kode === m[1]; });
      return x ? ok(x) : err(404, "Mata kuliah " + m[1] + " tidak ditemukan");
    }

    // ---------- nilai ----------
    if ((m = path.match(/^\/api\/nilai\/([^/]+)$/)) && method === "GET") {
      if (!db.mahasiswa.some(function (s) { return s.nrp === m[1]; })) return err(404, "Mahasiswa dengan NRP " + m[1] + " tidak ditemukan");
      return ok((db.nilai[m[1]] || []).map(function (n) {
        var mk = db.matkul.find(function (k) { return k.kode === n.kode; });
        return { kode: n.kode, matkul: mk ? mk.nama : n.kode, nilai: n.nilai };
      }));
    }

    // ---------- pengumuman ----------
    if (path === "/api/pengumuman" && method === "GET") return ok(db.pengumuman);

    // ---------- tugas ----------
    if (path === "/api/tugas") {
      if (method === "GET") return ok(db.tugas);
      if (method === "POST") {
        if ((e = validTugas(body, false))) return err(400, e);
        var t = { id: db.nextTugasId++, judul: body.judul.trim(), matkul: String(body.matkul || "Umum"), deadline: body.deadline, selesai: false };
        db.tugas.push(t); save();
        return ok(t, 201);
      }
      return err(405, "Method " + method + " tidak didukung di " + path);
    }
    if ((m = path.match(/^\/api\/tugas\/(\d+)$/))) {
      var j = db.tugas.findIndex(function (t) { return t.id === Number(m[1]); });
      if (j === -1) return err(404, "Tugas dengan id " + m[1] + " tidak ditemukan");
      if (method === "GET") return ok(db.tugas[j]);
      if (method === "PATCH" || method === "PUT") {
        if ((e = validTugas(body, true))) return err(400, e);
        ["judul", "matkul", "deadline", "selesai"].forEach(function (k) { if (k in body) db.tugas[j][k] = body[k]; });
        save(); return ok(db.tugas[j]);
      }
      if (method === "DELETE") { db.tugas.splice(j, 1); save(); return { status: 204, data: undefined }; }
      return err(405, "Method " + method + " tidak didukung di " + path);
    }

    return err(404, "Endpoint " + method + " " + path + " tidak ditemukan");
  }

  var STATUS_TEXT = { 200: "OK", 201: "Created", 204: "No Content", 400: "Bad Request", 404: "Not Found", 405: "Method Not Allowed", 409: "Conflict", 500: "Internal Server Error" };

  function notify(ev) {
    if (typeof window.__API_ONNET === "function") { try { window.__API_ONNET(ev); } catch (e) { /* abaikan */ } }
    else if (cfg.log && ev.phase !== "start" && window.console) {
      var label = ev.phase === "end" ? ev.status : ev.phase === "abort" ? "dibatalkan" : "GAGAL (offline)";
      console.info("[mock-api] " + ev.method + " " + ev.url + " → " + label + " (" + Math.round(ev.ms) + " ms)");
    }
  }

  function headerValue(headers, name) {
    if (!headers) return "";
    if (typeof Headers !== "undefined" && headers instanceof Headers) return headers.get(name) || "";
    if (Array.isArray(headers)) {
      for (var k = 0; k < headers.length; k++) if (String(headers[k][0]).toLowerCase() === name) return headers[k][1];
      return "";
    }
    for (var key in headers) if (key.toLowerCase() === name) return headers[key];
    return "";
  }

  function mockFetch(input, init) {
    init = init || {};
    var rawUrl = typeof input === "string" ? input : (input && input.url) ? input.url : String(input);
    var method = String(init.method || (input && input.method) || "GET").toUpperCase();
    var mm = rawUrl.match(/^(?:https?:\/\/api\.kampus\.dev)?(\/api\/[^?#]*)(\?[^#]*)?/);
    if (!mm) {
      if (realFetch) return realFetch(input, init);
      return Promise.reject(new TypeError("Failed to fetch"));
    }
    var path = mm[1].replace(/\/+$/, "") || "/api";
    var query = new URLSearchParams(mm[2] || "");
    var display = path + (mm[2] || "");
    var ct = String(headerValue(init.headers, "content-type") || "");
    var id = ++seq;
    var call = { id: id, method: method, path: path, url: display, contentType: ct, body: init.body, start: now(), end: null, status: null };
    calls.push(call);
    notify({ id: id, phase: "start", method: method, url: display, t: call.start });

    return new Promise(function (resolve, reject) {
      var signal = init.signal;
      var done = false;
      function finishAbort() {
        if (done) return; done = true;
        call.end = now(); call.status = "abort";
        notify({ id: id, phase: "abort", method: method, url: display, t: call.end, ms: call.end - call.start });
        var e; try { e = new DOMException("The user aborted a request.", "AbortError"); } catch (x) { e = new Error("The user aborted a request."); e.name = "AbortError"; }
        reject(e);
      }
      if (signal && signal.aborted) return finishAbort();
      if (signal && signal.addEventListener) signal.addEventListener("abort", finishAbort);

      var offline = cfg.mode === "offline";
      setTimeout(function () {
        if (done) return; done = true;
        if (signal && signal.removeEventListener) signal.removeEventListener("abort", finishAbort);
        call.end = now();
        if (offline || cfg.mode === "offline") {
          call.status = "offline";
          notify({ id: id, phase: "fail", method: method, url: display, t: call.end, ms: call.end - call.start });
          reject(new TypeError("Failed to fetch"));
          return;
        }
        var res;
        if (cfg.mode === "error500" || failPaths.indexOf(path) !== -1) {
          res = err(500, "Internal Server Error");
        } else {
          var body = {};
          if (method !== "GET" && method !== "DELETE" && init.body != null) {
            var text = typeof init.body === "string" ? init.body : String(init.body); // objek → "[object Object]" seperti browser asli
            if (/application\/json/i.test(ct)) {
              try { body = JSON.parse(text); } catch (e) { res = err(400, "Body bukan JSON valid: " + text.slice(0, 40)); }
              if (!res && (body === null || typeof body !== "object" || Array.isArray(body))) res = err(400, "Body JSON harus berupa objek");
            } else {
              body = {}; // seperti express.json(): tanpa header JSON, body diabaikan
            }
          }
          if (!res) {
            try { res = route(method, path, query, body); } catch (e) { res = err(500, "Internal Server Error: " + e.message); }
          }
        }
        call.status = res.status;
        var payload = (res.status === 204 || res.data === undefined) ? null : JSON.stringify(res.data);
        var response = new Response(payload, {
          status: res.status,
          statusText: STATUS_TEXT[res.status] || "",
          headers: payload === null ? {} : { "Content-Type": "application/json; charset=utf-8" }
        });
        notify({ id: id, phase: "end", method: method, url: display, status: res.status, t: call.end, ms: call.end - call.start });
        resolve(response);
      }, offline ? Math.min(400, latency(path, query)) : latency(path, query));
    });
  }

  window.fetch = mockFetch;
  window.__API = {
    get mode() { return cfg.mode; },
    setMode: function (m) { cfg.mode = m; return m; },
    setLatency: function (ms) { cfg.latency = ms; },
    gagalkan: function (p) { if (failPaths.indexOf(p) === -1) failPaths.push(p); },
    pulihkan: function () { failPaths.length = 0; cfg.mode = "normal"; },
    reset: function () { db = clone(SEED); save(); calls.length = 0; },
    simpan: function (on) { cfg.persist = !!on; save(); },
    get db() { return db; },
    calls: calls
  };
})();

  const [mhs, mk, info] = await Promise.allSettled([

    ambil("/api/pengumuman")
  ]);

  isi("#jml-mhs", jumlahAtauGagal(mhs));
  isi("#jml-mk", jumlahAtauGagal(mk));
  isi("#jml-info", jumlahAtauGagal(info));

}

const state = { status: "idle", data: [], error: null, q: "" };

function render() {
  status.className = "status";
  ulang.hidden = true;
  hasil.replaceChildren();

  if (state.status === "loading") {
    status.textContent = "Memuat…";
  } else if (state.status === "error") {
    status.textContent = `Gagal memuat: ${state.error}`;
    status.classList.add("error");
    ulang.hidden = false;
  } else if (state.status === "success") {
    if (state.data.length === 0) {
      status.textContent = `Tidak ada hasil untuk "${state.q}"`;
    } else {
      status.textContent = `${state.data.length} hasil`;
      state.data.forEach(function (m) {
        const li = document.createElement("li");
        li.textContent = m.nama;
        hasil.append(li);
      });
    }
  }
}

async function cari(q) {
  state.q = q;
  state.status = "loading";
  render();
  try {
    const res = await fetch(`/api/mahasiswa?q=${encodeURIComponent(q)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.data = await res.json();
    state.status = "success";
  } catch (err) {
    state.status = "error";
    state.error = err.message;
  }
  render();
}

  timer = setTimeout(function () {
    cari(input.value.trim());
  }, 300);
});

ulang.addEventListener("click", function () {
  cari(state.q);
});

  <script type="text/plain" data-k="challenge-js">
(function () {
  const state = { status: "loading", tugas: [], error: null, filter: "semua" };
  const form = document.querySelector("#form"), list = document.querySelector("#list"), info = document.querySelector("#info");

  async function api(url, opsi) {
    opsi = opsi || {};
    const init = { method: opsi.method || "GET" };
    if (opsi.body) { init.headers = { "Content-Type": "application/json" }; init.body = JSON.stringify(opsi.body); }
    const res = await fetch(url, init);
    if (!res.ok) { const b = await res.json().catch(() => ({})); throw new Error(b.error || "HTTP " + res.status); }
    return res.status === 204 ? null : res.json();
  }

  function render() {
    const aktif = state.tugas.filter(t => !t.selesai).length;
    document.querySelector("#counter").textContent = state.status === "success" ? aktif + " tugas aktif" : "";
    info.className = "info";
    info.textContent = "";
    list.innerHTML = "";
    if (state.status === "loading") {
      info.textContent = "⏳ Memuat tugas dari server…";
      list.innerHTML = '<li class="skel"></li><li class="skel"></li><li class="skel"></li>';
      return;
    }
    if (state.status === "error") {
      info.className = "info err2";
      info.textContent = "Gagal memuat: " + state.error;
      const b = document.createElement("button");
      b.id = "ulang"; b.type = "button"; b.textContent = "↻ Coba lagi";
      info.append(b);
      return;
    }
    const data = state.tugas
      .filter(t => state.filter === "semua" || (state.filter === "aktif" ? !t.selesai : t.selesai))
      .sort((a, b) => a.deadline.localeCompare(b.deadline));
    if (!data.length) list.innerHTML = '<li class="kosong">Tidak ada tugas di sini 🎉</li>';
    data.forEach(t => {
      const li = document.createElement("li");
      li.dataset.id = t.id;
      li.className = t.selesai ? "done" : "";
      li.innerHTML = '<input type="checkbox" class="cek"><div class="isi"><div class="judul"></div><div class="meta"></div></div><button class="hapus" type="button">✕</button>';
      li.querySelector(".cek").checked = t.selesai;
      li.querySelector(".judul").textContent = t.judul;
      li.querySelector(".meta").textContent = t.matkul + " · deadline " + t.deadline;
      list.append(li);
    });
  }

  async function muat() {
    state.status = "loading"; render();
    try {
      const [tugas, matkul] = await Promise.all([api("/api/tugas"), api("/api/matkul")]);
      state.tugas = tugas;
      form.elements.matkul.innerHTML = "";
      matkul.forEach(m => form.elements.matkul.append(new Option(m.nama, m.nama)));
      state.status = "success";
    } catch (e) {
      state.status = "error"; state.error = e.message;
    }
    render();
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.querySelector("#err"), btn = document.querySelector("#simpan");
    const judul = form.elements.judul.value.trim(), deadline = form.elements.deadline.value;
    if (judul.length < 3) { err.textContent = "Judul minimal 3 karakter."; return; }
    if (!deadline) { err.textContent = "Deadline wajib diisi."; return; }
    err.textContent = "";
    btn.disabled = true; btn.textContent = "Menyimpan…";
    try {
      const baru = await api("/api/tugas", { method: "POST", body: { judul, matkul: form.elements.matkul.value, deadline } });
      state.tugas.push(baru);
      form.elements.judul.value = ""; form.elements.deadline.value = "";
      render();
    } catch (e2) {
      err.textContent = "Gagal menyimpan: " + e2.message;
    } finally {
      btn.disabled = false; btn.textContent = "Tambah";
    }
  });

  list.addEventListener("click", async e => {
    const li = e.target.closest("li[data-id]"); if (!li) return;
    const id = Number(li.dataset.id);
    const t = state.tugas.find(x => x.id === id);
    if (!e.target.closest(".hapus, .cek")) return;
    li.classList.add("proses");
    try {
      if (e.target.closest(".hapus")) {
        await api("/api/tugas/" + id, { method: "DELETE" });
        state.tugas = state.tugas.filter(x => x.id !== id);
      } else {
        Object.assign(t, await api("/api/tugas/" + id, { method: "PATCH", body: { selesai: !t.selesai } }));
      }
    } catch (e2) {
      document.querySelector("#err").textContent = "Gagal memperbarui: " + e2.message;
    }
    render();
  });

  info.addEventListener("click", e => { if (e.target.id === "ulang") muat(); });

  document.querySelector("#filter").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.filter = b.dataset.f;
    document.querySelectorAll("#filter button").forEach(x => x.classList.toggle("on", x === b));
    render();
  });

  muat();
})();
  </script>

<script>
(function(){

  /* =====================================================================
     Utilitas
     ===================================================================== */
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  // Ambil blok teks mentah (script type=text/plain, atribut data-k), buang indentasi umum
  function block(k){
    const el = document.querySelector('script[data-k="'+k+'"]');
    if(!el) return '';
    const lines = el.textContent.replace(/<\\\/script/g, '</script').replace(/^\n+/, '').replace(/\s+$/, '').split('\n');
    let min = Infinity;
    lines.forEach(function(l){ if(l.trim()){ const m = l.match(/^ */)[0].length; if(m<min) min=m; } });
    if(!isFinite(min)) min = 0;
    return lines.map(function(l){ return l.slice(min); }).join('\n');
  }

  /* =====================================================================
     Syntax highlighter mini (JS & HTML) — dipakai panel kode & editor
     ===================================================================== */
  const JS_RE = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\[\s\S]|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(const|let|var|function|return|if|else|for|of|in|while|do|new|true|false|null|undefined|this|typeof|instanceof|switch|case|break|continue|default|class|try|catch|finally|throw|async|await)\b|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)(?=\s*\()/g;
  function hlJS(src){
    let out = '', last = 0, m;
    JS_RE.lastIndex = 0;
    while((m = JS_RE.exec(src))){
      out += esc(src.slice(last, m.index));
      const cls = m[1] ? 'tk-com' : m[2] ? 'tk-str' : m[3] ? 'tk-kw' : m[4] ? 'tk-num' : 'tk-fn';
      out += '<span class="'+cls+'">'+esc(m[0])+'</span>';
      last = JS_RE.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function hlHTML(src){
    let out = '', last = 0, m;
    const RE = /<\!--[\s\S]*?-->|<\/?[a-zA-Z][^>]*>/g;   // "<\!" agar parser HTML tidak masuk mode komentar
    while((m = RE.exec(src))){
      out += esc(src.slice(last, m.index));
      if(m[0].startsWith('<' + '!--')) out += '<span class="tk-com">'+esc(m[0])+'</span>';
      else out += hlTagSafe(m[0]);
      last = RE.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  // versi aman: tokenisasi manual isi tag supaya teks di luar token tetap di-escape
  function hlTagSafe(tag){
    let out = '', i = 0, m;
    const RE = /^(<\/?)([\w-]+)/;
    m = tag.match(RE);
    if(m){ out += '<span class="tk-punc">'+esc(m[1])+'</span><span class="tk-tag">'+esc(m[2])+'</span>'; i = m[0].length; }
    const rest = tag.slice(i);
    const TK = /("[^"]*"|'[^']*')|([\w\-:@]+)(?==)|(\/?>$)/g;
    let last = 0;
    while((m = TK.exec(rest))){
      out += esc(rest.slice(last, m.index));
      if(m[1]) out += '<span class="tk-str">'+esc(m[1])+'</span>';
      else if(m[2]) out += '<span class="tk-attr">'+esc(m[2])+'</span>';
      else out += '<span class="tk-punc">'+esc(m[3])+'</span>';
      last = TK.lastIndex;
    }
    return out + esc(rest.slice(last));
  }

  /* =====================================================================
     Sandbox runner: halaman mini di <iframe srcdoc> + console yang ditangkap
     ===================================================================== */
  const BASE_CSS = '*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:14px;color:#1d2b36;font-size:14px;line-height:1.45;background:#fff}h1{font-size:20px;margin:0 0 6px}h3{font-size:16px}button{font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid #132A3E;background:#132A3E;color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid #b7c9d6;border-radius:6px;background:#fff;color:#1d2b36}.kartu{border:1px solid #d7e1e8;border-radius:10px;padding:12px 14px;background:#fff}code{font-family:"IBM Plex Mono",ui-monospace,monospace;background:#eef3f7;padding:0 4px;border-radius:3px}kbd{border:1px solid #b7c9d6;border-radius:3px;padding:0 4px;font-size:11px}';

      var t = typeof v;

      if(t === 'string') return d ? {s:JSON.stringify(v), k:'val'} : {s:v, k:'str'};
      if(t === 'number' || t === 'boolean' || t === 'bigint') return {s:String(v), k:'val'};

        return {s:h, k:'el'};
      }
      if(typeof Promise !== 'undefined' && v instanceof Promise) return {s:'Promise {…}  ← janji, belum berupa nilai', k:'muted'};

      if(v instanceof NodeList || v instanceof HTMLCollection){
        var arr = Array.prototype.slice.call(v);

        return {s: nm + '(' + arr.length + ') [' + arr.slice(0, 8).map(function(x){ return x.nodeType === 1 ? tag(x) : '#text'; }).join(', ') + (arr.length > 8 ? ', …' : '') + ']', k:'el'};

      if(typeof DOMTokenList !== 'undefined' && v instanceof DOMTokenList) return {s:'DOMTokenList [' + Array.prototype.map.call(v, function(c){ return JSON.stringify(c); }).join(', ') + ']', k:'val'};

      if(Array.isArray(v)){

        return {s:'[' + v.slice(0, 20).map(function(x){ return fmt(x, d + 1).s; }).join(', ') + (v.length > 20 ? ', …' : '') + ']', k:'val'};
      }

        if(d > 1) return {s:'{…}', k:'muted'};
        var keys = Object.keys(v);

  function buildDoc(o, rid){

    const netCnt = root.querySelector('.ctab .cnt');
    let reqs = {}, order = [], t0 = null;
    function netEmpty(){
      reqs = {}; order = []; t0 = null;
      if(netBody) netBody.innerHTML = '<div class="console-empty">Belum ada request. Panggilan fetch() akan muncul di sini.</div>';
      if(netCnt) netCnt.textContent = '0';
    }
    function layoutBars(){
      let maxT = t0;
      order.forEach(function(id){ const q = reqs[id]; maxT = Math.max(maxT, q.end == null ? q.start : q.end); });
      const span = Math.max(maxT - t0, 1);
      order.forEach(function(id){
        const q = reqs[id], bar = q.row.querySelector('.net-bar i');
        const end = q.end == null ? maxT : q.end;
        bar.style.left = ((q.start - t0) / span * 100) + '%';
        bar.style.width = Math.max((end - q.start) / span * 100, 1.5) + '%';
        bar.className = q.end == null ? 'pending' : q.cls;
      });
    }
    r.net = function(ev){
      if(!netBody) return;
      if(ev.phase === 'start'){
        if(order.length === 0){ netBody.innerHTML = '<div class="net-row net-head"><span>Method</span><span>URL</span><span>Status</span><span style="text-align:right">Waktu</span><span>Waterfall</span></div>'; t0 = ev.t; }
        const row = document.createElement('div');
        row.className = 'net-row';
        row.innerHTML = '<span class="net-m"></span><span class="net-u"></span><span class="net-s sp">pending</span><span class="net-t">…</span><span class="net-bar"><i class="pending"></i></span>';
        row.children[0].textContent = ev.method;
        row.children[1].textContent = ev.url; row.children[1].title = ev.url;
        netBody.appendChild(row);
        reqs[ev.id] = { row: row, start: ev.t, end: null, cls: '' };
        order.push(ev.id);
        if(netCnt) netCnt.textContent = order.length;
      } else {
        const q = reqs[ev.id]; if(!q) return;
        q.end = ev.t;
        const s = q.row.children[2];
        if(ev.phase === 'end'){ s.textContent = ev.status; s.className = 'net-s s' + String(ev.status).charAt(0); q.cls = ev.status >= 500 ? 'bad' : ev.status >= 400 ? 'warn' : ''; }
        else if(ev.phase === 'fail'){ s.textContent = '(failed)'; s.className = 'net-s sx'; q.cls = 'bad'; }
        else { s.textContent = '(canceled)'; s.className = 'net-s sp'; q.cls = 'warn'; }
        q.row.children[3].textContent = Math.round(ev.ms) + ' ms';
      }
      layoutBars();
      netBody.scrollTop = netBody.scrollHeight;
    };
    root.querySelectorAll('.ctab').forEach(function(tab){
      tab.addEventListener('click', function(){
        root.querySelectorAll('.ctab').forEach(function(x){ x.classList.toggle('on', x === tab); });
        box.classList.toggle('show-net', tab.dataset.ctab === 'net');
      });
    });
    function empty(){
      cons.innerHTML = '<div class="console-empty">Console kosong — coba berinteraksi dengan preview di atas.</div>';
      r.count = 0;
    }
    r.clear = empty;
    r.log = function(type, parts){
      if(r.count === 0) cons.innerHTML = '';
      r.count++;
      const div = document.createElement('div');
      const cls = type === 'error' ? 'console-error' : type === 'warn' ? 'console-warn' : type === 'sys' ? 'console-sys' : 'console-out';
      div.className = 'console-line ' + cls;
      (parts || []).forEach(function(p, i){
        if(i) div.appendChild(document.createTextNode(' '));
        const s = document.createElement('span');
        s.className = (type === 'log') ? ('c-' + (p.k || 'str')) : '';
        s.textContent = p.s;
        div.appendChild(s);
      });
      cons.appendChild(div);
      while(cons.children.length > MAX_LINES) cons.removeChild(cons.firstChild);
      cons.scrollTop = cons.scrollHeight;
    };
    r.sys = function(text){ r.log('sys', [{s:text, k:'str'}]); };
    r.run = function(opts, keepConsole){
      if(r.rid) delete runs[r.rid];
      const rid = 'r' + (++runSeq);
      r.rid = rid; runs[rid] = r; r.last = opts; r.ran = true;
      if(!keepConsole){ empty(); netEmpty(); }
      if(burl) burl.textContent = url || 'index.html';
      frame.srcdoc = buildDoc(opts, rid);
    };
    const clearBtn = root.querySelector('[data-clear]');
    if(clearBtn) clearBtn.addEventListener('click', function(){ empty(); netEmpty(); });
    empty(); netEmpty();
    return r;
  }

      intro:'<p class="lede">Sebelum ada Promise, hasil pekerjaan asinkron dikirim lewat <b>callback</b>: fungsi yang kita titipkan untuk dipanggil nanti ketika hasilnya siap. Kalian sudah memakainya di <code>addEventListener</code> dan <code>setTimeout</code>.</p><ul class="key-points"><li>Konvensi <b>error-first</b> (gaya Node.js): <code>callback(err, data)</code> — cek <code>err</code> lebih dulu</li><li>Langkah yang saling bergantung (ambil user → ambil nilainya → ambil nama matkulnya) membuat callback <b>bersarang</b> semakin dalam: <i>callback hell</i> / <i>pyramid of doom</i></li><li>Masalahnya bukan hanya indentasi: penanganan error harus diulang di setiap tingkat, dan alurnya sulit diikuti</li><li>Kode lama &amp; banyak library masih memakai callback — kalian perlu bisa membacanya, lalu <b>membungkusnya jadi Promise</b> (Materi 4)</li></ul>',

    {
      id:'promise', label:'Materi 4', title:'Promise',
      intro:'<p class="lede"><b>Promise</b> adalah objek yang mewakili nilai yang <i>akan</i> ada: "janji" hasil pekerjaan asinkron. Daripada menitipkan callback ke fungsi, fungsi <b>mengembalikan</b> Promise, dan kita yang memutuskan apa yang dilakukan dengannya.</p><ul class="key-points"><li>Tiga status: <b>pending</b> → <b>fulfilled</b> (berhasil, punya nilai) atau <b>rejected</b> (gagal, punya error). Sekali settled, statusnya tidak berubah lagi</li><li><code>.then(fn)</code> untuk hasil, <code>.catch(fn)</code> untuk error, <code>.finally(fn)</code> selalu jalan (cocok untuk mematikan loading)</li><li><b>Chaining</b>: nilai yang di-<code>return</code> dari <code>.then</code> diteruskan ke <code>.then</code> berikutnya; jika yang di-return Promise, rantai menunggunya. Satu <code>.catch</code> di ujung menangkap error dari mana pun di rantai</li><li>Membuat sendiri: <code>new Promise((resolve, reject) =&gt; { … })</code> — jarang perlu, kecuali untuk membungkus API callback lama. <code>fetch</code> sudah mengembalikan Promise</li></ul>',
      icon:icons.promise, exHTML:'ex-promise-html', url:'dadu.html',
      controls:[
        {type:'buttons', prop:'hasil', label:'Hasil pekerjaan', initial:'resolve', options:[{value:'resolve',label:'resolve(6)'},{value:'reject',label:'reject(Error)'}]},
        {type:'buttons', prop:'bentuk', label:'Bentuk', initial:'rantai', options:[{value:'tunggal',label:'then + catch'},{value:'rantai',label:'rantai 2 then'}]}
      ],
      code:function(s){
        const L = ['const status = document.querySelector("#status");', 'const log = t => document.querySelector("#log").insertAdjacentHTML("beforeend", `<li>${t}</li>`);', 'function setStatus(s) { status.textContent = s; status.className = "status " + s; }', '',
          'function lemparDadu() {', '!  return new Promise(function (resolve, reject) {', '    setTimeout(function () {',
          s.hasil==='resolve' ? '!      resolve(6);' : '!      reject(new Error("Dadu jatuh dari meja!"));',
          '    }, 1200);', '  });', '}', '', 'log("promise dibuat → pending");', 'lemparDadu()'];
        if(s.bentuk==='rantai') L.push('!  .then(angka => {', '    setStatus("fulfilled");', '    log(`then #1 menerima ${angka}`);', '    return angka * 10;           // diteruskan ke then berikutnya', '  })', '!  .then(hasil => log(`then #2 menerima ${hasil}`))');
        else L.push('!  .then(angka => {', '    setStatus("fulfilled");', '    log(`then menerima ${angka}`);', '  })');
        L.push('!  .catch(err => {', '    setStatus("rejected");', '    log(`catch: ${err.message}`);', '  })', '!  .finally(() => log("finally: selalu dijalankan"));', '', 'log("kode setelah rantai — jalan duluan");');
        return L;
      },

        options:[{label:'C lalu D — B dilewati', correct:true},{label:'B, C, lalu D', correct:false},{label:'Hanya D', correct:false},{label:'Tidak ada — error menghentikan seluruh halaman', correct:false}]},
      lab:{title:'Bikin Promise sendiri', url:'promise.html',
        desc:'Buat dua fungsi yang mengembalikan Promise, lalu pakai dengan then/catch/finally.',
        steps:['<code>tunggu(ms)</code> mengembalikan Promise yang resolve setelah ms milidetik','<code>ambilUserP(nrp)</code> membungkus <code>ambilUser</code> (callback) → resolve(user) / reject(err)','Klik <b>Muat</b>: "Memuat…" → <code>.then</code> tulis nama + "Berhasil", <code>.catch</code> tulis pesan error','<code>.finally</code> mengaktifkan kembali tombol'],

    {
      id:'asyncawait', label:'Materi 5', title:'async / await',
      intro:'<p class="lede"><code>async</code>/<code>await</code> adalah cara menulis kode Promise agar terbaca seperti kode sinkron — dari atas ke bawah, tanpa rantai <code>.then</code>.</p><ul class="key-points"><li>Fungsi <code>async</code> <b>selalu mengembalikan Promise</b>. Nilai yang di-<code>return</code> menjadi nilai fulfilled; <code>throw</code> menjadi rejected</li><li><code>await promise</code> menjeda <b>fungsi itu saja</b> (bukan halaman) sampai Promise settled, lalu menghasilkan nilainya — atau melempar error-nya</li><li>Tangani error dengan <code>try { … } catch (err) { … } finally { … }</code> — sama seperti kode sinkron</li><li>Kesalahan umum: <b>lupa <code>await</code></b> → yang didapat objek Promise, bukan data. <code>await</code> hanya boleh di dalam fungsi <code>async</code> (atau top-level di ES module)</li><li>Di balik layar tetap Promise: <code>await</code> = <code>.then</code> versi yang lebih rapi</li></ul>',
      icon:icons.asyncawait, exHTML:'ex-asyncawait-html', helper:'ex-asyncawait-helper', url:'profil.html',

      code:function(s){

        if(s.v==='await' || s.v==='error') L.push('!async function muat() {', '  tulis("mulai…");', '  try {', '!    const user = await ambilUserP('+(s.v==='error'?'"0000000000"':'"5027241001"')+');', '    tulis("user: " + user.nama);', '!    const nilai = await ambilNilaiP(user.nrp);', '    tulis("jumlah nilai: " + nilai.length);', '!  } catch (err) {', '    tulis("error: " + err.message, "err");', '  } finally {', '    tulis("selesai");', '  }', '}', 'muat();', 'tulis("← muat() tidak memblokir baris ini");');

      lab:{title:'Refactor ke async/await', url:'profil.html',
        desc:'Kode awal sudah <b>berfungsi</b> dengan rantai <code>.then</code>. Tulis ulang agar lebih mudah dibaca — perilaku harus tetap sama.',
        steps:['Ubah <code>muatProfil</code> menjadi <code>async function</code>','Ganti setiap <code>.then</code> dengan <code>await</code> (tidak boleh ada <code>.then(</code> tersisa)','Pakai <code>try / catch / finally</code> untuk error &amp; mengaktifkan tombol','Tetap tampilkan nama &amp; rata-rata 1 desimal'],

    },
    {
      id:'json', label:'Materi 6', title:'JSON',
      intro:'<p class="lede"><b>JSON</b> (JavaScript Object Notation) adalah format <b>teks</b> untuk bertukar data. Server mengirim JSON, browser mengubahnya menjadi objek JavaScript — dan sebaliknya saat mengirim data.</p><ul class="key-points"><li><code>JSON.stringify(obj)</code> → teks; <code>JSON.stringify(obj, null, 2)</code> → teks rapi berindentasi</li><li><code>JSON.parse(teks)</code> → objek. Teks yang tidak valid melempar <b>SyntaxError</b> — bungkus dengan <code>try/catch</code> jika sumbernya tidak pasti</li><li>Aturan lebih ketat dari objek JS: kunci dan string wajib tanda kutip <b>ganda</b>, tanpa koma di akhir, tanpa komentar</li><li>Yang <b>hilang/berubah</b> saat di-stringify: fungsi &amp; <code>undefined</code> dibuang, <code>Date</code> menjadi string — tidak kembali menjadi Date saat di-parse</li><li>Di <code>fetch</code>, <code>await res.json()</code> = membaca body lalu <code>JSON.parse</code> sekaligus</li></ul>',

  function expandSteps(steps){

    const all = [cur];
    steps.forEach(function(s){
      const n = Object.assign({}, cur, { hot: s.hot || null, loop: !!s.loop, fresh: false });
      ['line', 'stack', 'web', 'micro', 'macro', 'note'].forEach(function(k){ if(k in s) n[k] = s[k]; });
      if(s.log){ n.out = cur.out.concat([s.log]); n.fresh = true; }
      all.push(n); cur = n;
    });
    return all;
  }
  function initViz(section){
    const codeEl = section.querySelector('[data-code]');
    const note = section.querySelector('.viz-note');
    const loopEl = section.querySelector('.viz-loop');
    const playBtn = section.querySelector('[data-viz-act="play"]');
    let sc = Object.keys(VIZ)[0], states = expandSteps(VIZ[sc].steps), i = 0, timer = null;
    function items(arr){
      if(!arr.length) return '<span class="viz-empty">kosong</span>';
      return arr.map(function(x){ return '<div class="viz-item" title="'+esc(x)+'">'+esc(x)+'</div>'; }).join('');
    }
    function draw(){
      const st = states[i], code = VIZ[sc].code;
      const hl = hlJS(code.join('\n')).split('\n');
      codeEl.innerHTML = '<pre class="hl-code">' + hl.map(function(h, k){ return '<span class="ln'+(k===st.line?' cs-hl':'')+'">'+(h||' ')+'</span>'; }).join('') + '</pre>';
      ['stack', 'web', 'micro', 'macro'].forEach(function(b){
        const box = section.querySelector('[data-box="'+b+'"]');
        box.querySelector('.viz-items').innerHTML = items(st[b]);
        box.classList.toggle('hot', st.hot === b);
      });
      const outBox = section.querySelector('[data-box="out"]');
      outBox.classList.toggle('hot', st.hot === 'out');
      outBox.querySelector('.viz-out').innerHTML = st.out.length ? st.out.map(function(o, k){ return '<div class="'+(st.fresh && k===st.out.length-1?'new':'')+'">'+esc(o)+'</div>'; }).join('') : '<span class="viz-empty">belum ada output</span>';
      note.innerHTML = '<span class="viz-count">Langkah ' + i + ' / ' + (states.length - 1) + '</span>' + st.note;
      loopEl.classList.toggle('spin', st.loop);
      section.querySelector('[data-viz-act="prev"]').disabled = i === 0;
      section.querySelector('[data-viz-act="next"]').disabled = i === states.length - 1;
    }
    function stop(){ if(timer){ clearInterval(timer); timer = null; } playBtn.textContent = '⏵ Auto'; }
    function play(){
      if(i === states.length - 1) i = 0;
      draw();
      playBtn.textContent = '⏸ Jeda';
      timer = setInterval(function(){ if(i < states.length - 1){ i++; draw(); } else stop(); }, 1400);
    }
    vizStop = stop;
    section.querySelector('[data-viz-sc]').addEventListener('click', function(e){
      const b = e.target.closest('.choice'); if(!b) return;
      this.querySelectorAll('.choice').forEach(function(x){ x.classList.toggle('on', x === b); });
      stop(); sc = b.dataset.value; states = expandSteps(VIZ[sc].steps); i = 0; draw();
    });

      const b = e.target.closest('[data-viz-act]'); if(!b) return;
      const act = b.dataset.vizAct;
      if(act === 'play'){ if(timer) stop(); else play(); return; }
      stop();
      if(act === 'reset') i = 0;
      if(act === 'prev' && i > 0) i--;
      if(act === 'next' && i < states.length - 1) i++;
      draw();
    });
    draw();
  }

      if(e.key === 'Tab' && !e.shiftKey){ e.preventDefault(); insertText(ta, '  '); return; }
      if(e.key === 'Enter' && !e.shiftKey && !e.altKey){

  function updateNextState(){

    if(mobileProgress) mobileProgress.textContent = 'Slide ' + (idx+1) + ' / ' + slides.length;
    prevBtn.disabled = idx===0;
    updateNextState();
    activate(slides[idx]);
  }
  function goToId(id){
    const i = slides.indexOf(document.getElementById(id));
    if(i>=0) goTo(i);
  }
  prevBtn.addEventListener('click', function(){ goTo(idx-1); });
  nextBtn.addEventListener('click', function(){ if(canAdvance()) goTo(idx+1); else shake(); });
  prevBtn.disabled = true;
  if(mobileProgress) mobileProgress.textContent = 'Slide 1 / ' + slides.length;
  updateNextState();
  updateBadge();

  document.addEventListener('keydown', function(e){
    if(['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' '){
      if(e.target.tagName === 'BUTTON' && e.key === ' ') return;
      if(e.key === ' ') e.preventDefault();
      if(canAdvance()) goTo(idx+1); else shake();
    }
    if(e.key === 'ArrowLeft' || e.key === 'PageUp') goTo(idx-1);
    if(e.key === 'f' || e.key === 'F') toggleFullscreen();
  });

  let touchStartX = 0, touchStartY = 0, touchIgnore = false;
  document.addEventListener('touchstart', function(e){
    touchIgnore = !!(e.target.closest && e.target.closest('.editor, .code-panel, .console-body, .browser'));
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });
  document.addEventListener('touchend', function(e){
    if(touchIgnore) return;
    const diffX = e.changedTouches[0].screenX - touchStartX;
    const diffY = e.changedTouches[0].screenY - touchStartY;
    if(Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)){
      if(diffX < 0){ if(canAdvance()) goTo(idx+1); else shake(); }
      else goTo(idx-1);
    }
  }, { passive: true });
})();
</script>
</body>
</html>
